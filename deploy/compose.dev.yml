# ============================================================================
# 本地开发专用覆盖文件 —— 只用于 `make infra` 与 `make dev`
#
# 用法（必须显式 -f 叠加）：
#
#   docker compose -f docker-compose.yml -f deploy/compose.dev.yml \
#     up -d --build mysql docgen gotenberg
#
# ⚠️ 刻意**不叫** docker-compose.override.yml
#
#   Compose 会自动加载名为 docker-compose.override.yml 的文件。那样一来，
#   `docker compose up`（生产部署用的就是这条命令）会悄悄把这份「把内部服务
#   端口暴露到宿主机」的配置一并应用上——而这份文件存在的全部理由，恰恰是它
#   **不能**在生产生效。
#   换个名字的代价是「必须显式 -f」；这正是我们要的：暴露端口这件事必须被写出来。
#
# ---------------------------------------------------------------------------
# 为什么需要这份文件
# ---------------------------------------------------------------------------
#
# 主 compose 里 docgen 与 gotenberg 只挂在 secrisk-internal 上，而那张网是
# `internal: true` —— 宿主机**完全无法**访问它们（这也正是生产要的效果：
# 内部渲染服务不该有对外入口）。
#
# 但 `make dev` 是在宿主机上跑 Go 主服务，它必须能连到这两个上游。
# 于是这里给它们补一条「回环端口映射」。
#
# ---------------------------------------------------------------------------
# ⚠️ 一个实测出来的坑：internal 网络上的端口映射会被**静默丢弃**
# ---------------------------------------------------------------------------
#
# 「给一个只挂在 internal: true 网络上的服务加 ports」这件事，Docker 不报错、
# 不警告，直接把端口映射整个丢掉：`docker port` 输出为空、`docker ps` 的
# PORTS 列也是空。事后用 `docker network connect` 补一张普通网络也**补不回来**
# —— 端口绑定在容器创建那一刻就定了。
#
# 实测（docker 28.3.2 / Docker Desktop + Compose v2）：
#
#   只挂 internal      + ports → 无绑定，宿主连接被拒
#   internal + 普通网  + ports → 80/tcp -> 127.0.0.1:18096，宿主 HTTP 200 ✅
#
# 所以下面不是「加个 ports」就完事，而是**先让它们多挂一张非 internal 的
# dev-edge 网络，再加 ports**。
# 漏掉这一步的症状极具误导性：配置文件看起来完全正确、容器也起来了、
# `make dev` 也不报错，只有点「导出 Word / PDF」时才变成 503，
# 让人以为是 docgen 或 gotenberg 坏了，而在容器里 `curl localhost:8090`
# 一切正常。
# ============================================================================

services:
  # --------------------------------------------------- 文档服务（C# / .NET 10）
  docgen:
    # 多挂一张**非 internal** 网络，端口映射才会生效（见文件头说明）
    networks:
      - secrisk-internal
      - dev-edge
    ports:
      # 只绑回环：本机开发能连，局域网不可见。
      # 内部服务即使在开发机上也不该被同网段的其它机器摸到。
      - "127.0.0.1:${DOCGEN_PORT:-8090}:8090"

  # ---------------------------------------------------- PDF 渲染（Gotenberg）
  gotenberg:
    networks:
      - secrisk-internal
      - dev-edge
    ports:
      - "127.0.0.1:${GOTENBERG_PORT:-3000}:3000"

networks:
  # 仅开发用的「宿主机可达」网络。
  # 命名为 dev-edge 而不是复用 secrisk-net：secrisk-net 上挂着 web 与 mysql，
  # 把渲染服务塞进去会让生产拓扑与本地的差异变大，而这份文件的目的是
  # 「只在网络暴露面上做最小改动」。
  dev-edge:
    driver: bridge
