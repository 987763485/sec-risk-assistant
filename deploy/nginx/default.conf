# ============================================================================
# Nginx 站点配置 —— 静态资源 + API 反向代理 + 安全响应头
#
# 安全要点：
#   1. server_tokens off        隐藏版本号，减少指纹信息
#   2. 上传/导出目录物理隔离     /uploads 与 /reports 直接 403，绝不解析执行
#   3. CSP                      限制脚本来源，缓解 XSS
#   4. 只转发 /api 到后端       前端代码与后端不在同一路径空间，避免误暴露
# ============================================================================

upstream secrisk_server {
    server server:8080;
    keepalive 32;
}

server {
    listen       80;
    server_name  _;

    # 隐藏 nginx 版本号
    server_tokens off;

    root  /usr/share/nginx/html;
    index index.html;

    # 上传体积上限：与 gotenberg --api-body-limit 及后端 limit 保持一致
    client_max_body_size 64m;
    client_body_timeout  120s;

    # ---------------- gzip ----------------
    gzip              on;
    gzip_vary         on;
    gzip_min_length   1024;
    gzip_comp_level   5;
    gzip_proxied      any;
    gzip_types
        text/plain text/css text/xml
        application/json application/javascript application/xml+rss
        application/vnd.ms-fontobject font/ttf font/otf image/svg+xml;

    # ---------------- 安全响应头 ----------------
    # CSP 说明：'unsafe-inline' 是 Vue + Element Plus 运行时注入样式所必需；
    #           接入 CDN 或内联脚本审计完成后应进一步收紧（见 docs/08）。
    add_header Content-Security-Policy
        "default-src 'self'; \
         script-src 'self' 'unsafe-inline'; \
         style-src 'self' 'unsafe-inline'; \
         img-src 'self' data: blob:; \
         font-src 'self' data:; \
         connect-src 'self'; \
         object-src 'none'; \
         base-uri 'self'; \
         frame-ancestors 'none';" always;

    add_header X-Content-Type-Options   "nosniff" always;
    add_header X-Frame-Options          "DENY" always;
    add_header Referrer-Policy          "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy       "geolocation=(), microphone=(), camera=()" always;

    # ---------------- 容器 healthcheck ----------------
    location = /healthz {
        access_log off;
        default_type text/plain;
        return 200 "ok\n";
    }

    # ---------------- API 反向代理 ----------------
    location /api/ {
        proxy_pass         http://secrisk_server;
        proxy_http_version 1.1;

        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        # 透传请求 ID，便于跨服务串联日志
        proxy_set_header X-Request-ID      $request_id;
        proxy_set_header Connection        "";

        proxy_connect_timeout 10s;
        # ⚠️ 这两个超时必须**大于后端自己的 WriteTimeout**（180s，见
        #    config.go 的 server.write_timeout 默认值），否则会出现一种
        #    最难排查的失败形态：后端还在渲染，nginx 先按超时把连接切断，
        #    于是用户收到的是 nginx 的 504 而不是我们精心准备的
        #    「报告渲染服务暂时不可用，请稍后重试」（503 REPORT_RENDER_FAILED）。
        #    两个 5xx 长得差不多，但前者不带 JSON 错误信封，前端只能弹一句
        #    「网络错误」，用户不知道是该重试还是该找人。
        proxy_send_timeout    200s;
        proxy_read_timeout    200s;

        # 报告导出可能返回大文件，关闭缓冲避免内存堆积
        proxy_buffering off;
    }

    # ---------------- 上传 / 导出目录：禁止直接访问 ----------------
    # 这两个路径下的文件一律经后端接口鉴权后下载，绝不能由 nginx 直接吐出去，
    # 更不能落到可执行解析的位置（webshell 防线）。
    location ^~ /uploads/ {
        deny all;
        return 403;
    }
    location ^~ /reports/ {
        deny all;
        return 403;
    }

    # ---------------- 静态资源缓存 ----------------
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        access_log off;
        try_files $uri =404;
    }

    location = /favicon.ico {
        expires 7d;
        access_log off;
        try_files $uri =404;
    }

    # ---------------- SPA 前端路由回退 ----------------
    # index.html 必须不缓存，否则发版后用户仍加载旧版 JS
    location / {
        try_files $uri $uri/ /index.html;
    }
    location = /index.html {
        add_header Cache-Control "no-store, must-revalidate";
        add_header Content-Security-Policy
            "default-src 'self'; \
             script-src 'self' 'unsafe-inline'; \
             style-src 'self' 'unsafe-inline'; \
             img-src 'self' data: blob:; \
             font-src 'self' data:; \
             connect-src 'self'; \
             object-src 'none'; \
             base-uri 'self'; \
             frame-ancestors 'none';" always;
    }

    # 隐藏静态资源 404 细节
    error_page 404 /index.html;
}
