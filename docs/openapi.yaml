# 网络安全风险评估助手 —— HTTP API 契约
#
# ⚠️ 本文件是接口契约的**唯一真相源**（single source of truth）。
#
# 为什么手写而不是从代码注解生成（swag / swaggo 等）：
#   swag 类工具把契约的真相源放在 handler 的注释里。注释不会因为编译失败
#   而报错，也不会被静态检查覆盖，因此它天然会随代码演进悄悄腐烂——
#   最后「文档」和「实现」各说各话，而工具只保证两者都能生成。
#   手写 spec 则把这件事变成一个可被 CI 拦下的**断言**：
#   server/internal/router/openapi_test.go 会双向比对本文件与 gin 真实
#   路由表，任何一侧多出/少掉端点都会让测试变红（见 make api-check）。
#
# 具体做法：
#   - 契约变更 → 先改本文件 → 再改代码 → 跑 make api-check
#   - 代码变更忘了改本文件 → 测试失败，强制回来补
#
# 约定：
#   - 所有 /api 下的业务响应统一使用信封 { code, message, data, request_id }
#   - /healthz、/api/health、/api/version 是运维探针，刻意不套信封
#     （探针应能被任意语言的最小客户端解析，不该要求它理解业务信封）
#   - 时间一律为 RFC3339；可空字段显式允许 null
# -----------------------------------------------------------------------------

openapi: 3.1.0

info:
  title: 网络安全风险评估助手 API
  version: 0.1.0
  summary: 认证、用户与审计接口
  description: |
    ## 认证模型

    本服务使用 **Cookie 会话 + 双提交 CSRF 令牌**，不使用 `Authorization` 头。
    登录成功后由服务端下发三枚 Cookie：

    | Cookie | 属性 | 有效期 | 作用 |
    | --- | --- | --- | --- |
    | `sr_at` | HttpOnly, SameSite=Lax | 15 分钟 | 访问令牌（JWT HS256） |
    | `sr_rt` | HttpOnly, SameSite=Lax, **Path=/api/auth** | 7 天 | 刷新令牌（不透明随机串） |
    | `sr_csrf` | **非** HttpOnly, SameSite=Lax | 7 天 | 双提交 CSRF 令牌 |

    三点设计意图：

    1. **访问令牌不放 `Authorization` 头**：HttpOnly Cookie 让 XSS 无法读取令牌，
       前端也不必把令牌存进 `localStorage`（那是 XSS 的提款机）。
    2. **刷新令牌限定 `Path=/api/auth`**：浏览器只会在访问 `/api/auth/*` 时携带它，
       业务请求即使被注入也无法顺带泄露刷新令牌。
    3. **`sr_csrf` 刻意设为非 HttpOnly**：前端必须能读到它才能回填到请求头，
       这正是「双提交」能成立的前提。它的安全性来自「攻击者跨站时读不到
       本域 Cookie」，而不是来自保密。

    ## 写请求必须携带 CSRF 令牌

    所有 `POST` / `PATCH` / `PUT` / `DELETE` 请求都必须同时满足：

    - 请求头 `X-CSRF-Token` 的值 == `sr_csrf` Cookie 的值；
    - `Origin` 在服务端白名单内（缺失 `Origin` 的跨站请求按拒绝处理）。

    应用启动时应先调用 `GET /api/auth/csrf` 取回令牌。

    ## 错误处理

    业务失败返回统一信封，`code` 是**给程序看的**（前端据此决定弹提示、
    跳登录还是静默刷新），`message` 是**给人看的**（可随时改写文案）。
    「用户名不存在」与「密码错误」刻意返回同一个 `AUTH_INVALID_CREDENTIALS`，
    避免接口退化成账号枚举器。

    ## 权限码

    权限码形如 `<资源>:<动作>`，只有 `read` / `write` 两档。
    权限码**不写入 JWT**：令牌只承载身份，权限在每个请求上现查一次数据库。
    这样「禁用账号 / 撤销角色 / 改密码」可以即时生效，而不必等令牌自然过期。
    当前登录者的权限码由 `GET /api/auth/me` 下发，前端据此构建动态路由与菜单。

servers:
  - url: http://localhost:8080
    description: 本地开发（前端 dev server 通过代理转发到此）

tags:
  - name: system
    description: 运维探针，不套业务信封、不需要认证
  - name: auth
    description: 认证与会话
  - name: users
    description: 用户管理
  - name: audit
    description: 审计日志（只读）
  - name: dictionaries
    description: 业务字典（资产类型 / 威胁 / 脆弱性 / 已有措施）
  - name: asset-groups
    description: 资产分组（层级树）
  - name: assets
    description: 资产台账与 Excel 批量导入
  - name: files
    description: 扫描报告文件（上传 / 下载 / 删除）
  - name: parser
    description: 扫描报告解析（预览 / 入库，与文件联动）
  - name: vulnerabilities
    description: 漏洞清单（解析产出 + 手工录入）
  - name: assessments
    description: 风险评估任务、试算、计算与结果（P4）
  - name: system-configs
    description: 系统配置（风险模型的权重与阈值）
  - name: reports
    description: 报告导出（Word / Excel / PDF，P5）
  - name: remediations
    description: 整改跟踪（整改单流转 / 逾期提醒，P6）
  - name: dashboard
    description: 首页统计（只读聚合，P6）

# 默认不认证：公开端点无需声明，受保护端点必须显式列出 security
security: []

paths:
  # ============================================================ 运维探针
  /healthz:
    get:
      tags: [system]
      operationId: getLiveness
      summary: 存活探针
      description: |
        只证明进程还在运行，**不探测数据库**。这个区分很重要：若存活探针依赖
        数据库，数据库短暂抖动会导致容器被反复重启，反而放大故障。
      responses:
        "200":
          description: 进程存活
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthLive"

  /api/health:
    get:
      tags: [system]
      operationId: getReadiness
      summary: 就绪探针
      description: 逐项检查下游依赖（当前为数据库），任一不可用即返回 `503` 且 `status` 为 `degraded`。
      responses:
        "200":
          description: 所有依赖可用
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthReady"
        "503":
          description: 至少一个依赖不可用
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthReady"

  /api/version:
    get:
      tags: [system]
      operationId: getVersion
      summary: 构建版本信息
      responses:
        "200":
          description: 版本信息
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/VersionInfo"

  # ============================================================ 认证
  /api/auth/csrf:
    get:
      tags: [auth]
      operationId: getCsrfToken
      summary: 获取 CSRF 双提交令牌
      description: |
        前端在应用启动时调用一次。令牌同时写入 `sr_csrf` Cookie 与响应体：
        Cookie 供同源部署直接读取，响应体供前后端分端口开发时使用
        （开发环境下读跨端口 Cookie 会受第三方 Cookie 策略影响）。
      responses:
        "200":
          description: 令牌已下发，同时写入 `sr_csrf` Cookie
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/OkEnvelope"
                  - type: object
                    required: [data]
                    properties:
                      data:
                        $ref: "#/components/schemas/CsrfToken"

  /api/auth/login:
    post:
      tags: [auth]
      operationId: login
      summary: 登录
      description: |
        成功后下发 `sr_at` / `sr_rt` / `sr_csrf` 三枚 Cookie。

        可能的失败码：

        | code | 状态码 | 含义 |
        | --- | --- | --- |
        | `INVALID_PARAM` | 400 | 未填写登录名或密码 |
        | `AUTH_INVALID_CREDENTIALS` | 401 | 用户名或密码错误（**两者不区分**） |
        | `AUTH_ACCOUNT_DISABLED` | 403 | 账号已被管理员禁用 |
        | `AUTH_CSRF_INVALID` | 403 | CSRF 令牌缺失或与 Cookie 不一致 |
        | `AUTH_ACCOUNT_LOCKED` | 423 | 连续失败达阈值，账号被临时锁定 |
        | `TOO_MANY_REQUESTS` | 429 | 来源 IP 触发登录限流 |

        账号锁定防「盯着一个账号猛试」，IP 限流防「换着用户名轮着试」，两者互补。
      security:
        - CSRFToken: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/LoginRequest"
      responses:
        "200":
          description: 登录成功
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/OkEnvelope"
                  - type: object
                    required: [data]
                    properties:
                      data:
                        $ref: "#/components/schemas/Session"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "423":
          $ref: "#/components/responses/Locked"
        "429":
          $ref: "#/components/responses/TooManyRequests"

  /api/auth/refresh:
    post:
      tags: [auth]
      operationId: refreshSession
      summary: 刷新登录状态
      description: |
        用 `sr_rt` 换取新的一套令牌，**并立即作废旧的刷新令牌**（轮换）。

        重放检测：如果收到一个已被使用过的刷新令牌，说明它可能已泄漏——服务端
        会吊销整条会话链（同一 `family_id` 下的全部令牌），攻击者与被攻击者
        一起掉线，用户重新登录即可。此事件会写入审计日志
        （`auth.token_reuse_detected`）。

        刷新失败时服务端会一并清除 Cookie，避免前端拿着已作废的令牌死循环重试。
      security:
        - CSRFToken: []
      responses:
        "200":
          description: 刷新成功，同时下发三枚新 Cookie
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/OkEnvelope"
                  - type: object
                    required: [data]
                    properties:
                      data:
                        $ref: "#/components/schemas/Session"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"

  /api/auth/logout:
    post:
      tags: [auth]
      operationId: logout
      summary: 登出
      description: |
        吊销整条会话链（而非仅当前这一个刷新令牌——登出的语义是「结束这次登录」），
        并把该账号的 `token_not_before` 推到当前时刻，使**已签发的访问令牌立即失效**。

        最后这点是为弥补 JWT 无状态的固有短板：若不这么做，用户点了登出之后
        那枚 15 分钟有效的访问令牌仍能被继续使用直到自然过期。

        使用「可选认证」：访问令牌已过期时也必须能正常登出。
      security:
        - CSRFToken: []
      responses:
        "200":
          description: 已登出，三枚 Cookie 被清除
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/OkEnvelope"
                  - type: object
                    required: [data]
                    properties:
                      data:
                        $ref: "#/components/schemas/LoggedOutPayload"

  /api/auth/me:
    get:
      tags: [auth]
      operationId: getCurrentUser
      summary: 获取当前登录者
      description: |
        返回身份、角色、以及**当前生效的权限码全集**。前端据 `permissions`
        构建动态路由与菜单，不做任何硬编码的角色判断。

        权限码是在本次请求里现查数据库得到的，因此管理员刚调整过角色，
        这里立刻就能看到，无需重新登录。
      security:
        - SessionCookie: []
      responses:
        "200":
          description: 当前登录者信息
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/OkEnvelope"
                  - type: object
                    required: [data]
                    properties:
                      data:
                        $ref: "#/components/schemas/Me"
        "401":
          $ref: "#/components/responses/Unauthorized"

  /api/auth/password:
    patch:
      tags: [auth]
      operationId: changePassword
      summary: 修改本人密码
      description: |
        修改成功后**保留当前会话**（当前刷新令牌所属的会话链不吊销），
        但会作废该账号在其他设备上的全部会话。

        被管理员重置过密码的账号（`must_change_password = true`）在改密前
        只能访问 `/api/auth/me`、`/api/auth/csrf`、`/api/auth/password`、
        `/api/auth/refresh`、`/api/auth/logout`，其余接口返回
        `403 AUTH_MUST_CHANGE_PASSWORD`。

        可能的失败码：`AUTH_PASSWORD_WEAK`（400，密码不足 8 位或超过 128 位）、
        `AUTH_PASSWORD_MISMATCH`（400，原密码不正确）、
        `AUTH_PASSWORD_UNCHANGED`（400，新密码与原密码相同）。
      security:
        - SessionCookie: []
          CSRFToken: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ChangePasswordRequest"
      responses:
        "200":
          description: 密码已修改
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/OkEnvelope"
                  - type: object
                    required: [data]
                    properties:
                      data:
                        $ref: "#/components/schemas/ChangedPayload"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"

  # ============================================================ 用户管理
  /api/users:
    get:
      tags: [users]
      operationId: listUsers
      summary: 分页查询用户
      description: |
        分页参数写错（非数字、越界）会被**自动收敛**而不是报 400：分页填错不值得
        打断用户，但也不能让它穿透到 SQL 层造成全表扫描（`pageSize` 上限 100）。
      security:
        - SessionCookie: []
      parameters:
        - $ref: "#/components/parameters/Page"
        - $ref: "#/components/parameters/PageSize"
        - name: keyword
          in: query
          description: 按登录名或显示名模糊匹配（`LIKE` 通配符已被转义，不会被当作模式注入）
          schema:
            type: string
            maxLength: 64
        - name: status
          in: query
          description: 按账号状态过滤
          schema:
            $ref: "#/components/schemas/UserStatus"
        - name: role
          in: query
          description: 按角色码过滤，如 `admin`
          schema:
            type: string
      responses:
        "200":
          description: 用户分页结果
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/OkEnvelope"
                  - type: object
                    required: [data]
                    properties:
                      data:
                        $ref: "#/components/schemas/UserPage"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"

    post:
      tags: [users]
      operationId: createUser
      summary: 新建用户
      description: |
        需要权限 `user:write`。

        新建的账号一律带 `must_change_password = true`：管理员设定的初始密码
        必须由本人改掉，否则「管理员知道每个人密码」这件事会一直成立。

        可能的失败码：`USER_USERNAME_TAKEN`（409）、`USER_EMAIL_TAKEN`（409）、
        `USER_ROLE_NOT_ASSIGNABLE`（400，角色码不存在）、
        `AUTH_PASSWORD_WEAK`（400）。
      security:
        - SessionCookie: []
          CSRFToken: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateUserRequest"
      responses:
        "201":
          description: 创建成功。审计动作 `user.create`。
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/OkEnvelope"
                  - type: object
                    required: [data]
                    properties:
                      data:
                        $ref: "#/components/schemas/UserDetail"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "409":
          $ref: "#/components/responses/Conflict"

  /api/users/{id}:
    parameters:
      - $ref: "#/components/parameters/UserId"
    get:
      tags: [users]
      operationId: getUser
      summary: 查询用户详情
      description: 需要权限 `user:read`。
      security:
        - SessionCookie: []
      responses:
        "200":
          description: 用户详情
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/OkEnvelope"
                  - type: object
                    required: [data]
                    properties:
                      data:
                        $ref: "#/components/schemas/UserDetail"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"

    patch:
      tags: [users]
      operationId: updateUser
      summary: 编辑用户资料、状态与角色
      description: |
        需要权限 `user:write`。审计动作 `user.update`。

        请求体全部字段可选，`null` 与「不传」语义不同：

        | 字段 | 不传 | 传 `null` / 空 |
        | --- | --- | --- |
        | `display_name` | 不改 | 清空（回落为登录名） |
        | `email` | 不改 | 置空 |
        | `status` | 不改 | 非法，必须显式传 `active` 或 `disabled` |
        | `roles` | 不改角色 | 清空全部角色 |

        两条安全护栏，均在 `409` 下以专门错误码返回：

        - `USER_SELF_OPERATION`：不允许把自己禁用（防误操作把自己锁在门外）；
        - `USER_LAST_ADMIN`：不允许移除系统中最后一个启用的管理员。
          该判断在一个对 `admin` 角色行加排他锁的事务内完成，
          以串行化并发变更——否则两个请求可能同时读到「还有另一个管理员」
          而双双放行，最终系统失去管理入口。

        账号被改为 `disabled` 时，其全部会话会被立即吊销。
      security:
        - SessionCookie: []
          CSRFToken: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdateUserRequest"
      responses:
        "200":
          description: 更新后的用户详情
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/OkEnvelope"
                  - type: object
                    required: [data]
                    properties:
                      data:
                        $ref: "#/components/schemas/UserDetail"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"

  /api/users/{id}/reset-password:
    post:
      tags: [users]
      operationId: resetUserPassword
      summary: 重置他人密码
      description: |
        需要权限 `user:write`。审计动作 `user.password_reset`。

        被重置者下次登录必须改密，且其全部既有会话立即失效。
      security:
        - SessionCookie: []
          CSRFToken: []
      parameters:
        - $ref: "#/components/parameters/UserId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ResetPasswordRequest"
      responses:
        "200":
          description: 密码已重置
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/OkEnvelope"
                  - type: object
                    required: [data]
                    properties:
                      data:
                        $ref: "#/components/schemas/ResetPayload"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"

  /api/users/{id}/unlock:
    post:
      tags: [users]
      operationId: unlockUser
      summary: 解除账号锁定
      description: |
        需要权限 `user:write`。清零失败登录计数并清除锁定到期时间。
        审计动作记为 `user.update`（明细中带 `unlocked: true`）。
      security:
        - SessionCookie: []
          CSRFToken: []
      parameters:
        - $ref: "#/components/parameters/UserId"
      responses:
        "200":
          description: 已解锁
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/OkEnvelope"
                  - type: object
                    required: [data]
                    properties:
                      data:
                        $ref: "#/components/schemas/UnlockedPayload"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"

  # ============================================================ 角色字典
  /api/roles:
    get:
      tags: [users]
      operationId: listRoles
      summary: 角色字典
      description: |
        需要权限 `role:read` 或 `user:read`（能看用户的人通常也需要在分配界面看到角色）。

        **不下发角色到权限码的映射**：那是后端的唯一真相（`internal/auth/rbac.go`）。
        前端只用 `me` 返回的 `permissions` 做动态路由，避免产生第二份权限表
        而两份表必然逐渐失配。
      security:
        - SessionCookie: []
      responses:
        "200":
          description: 全部角色
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/OkEnvelope"
                  - type: object
                    required: [data]
                    properties:
                      data:
                        $ref: "#/components/schemas/RoleList"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"

  # ============================================================ 审计日志
  /api/audit-logs:
    get:
      tags: [audit]
      operationId: listAuditLogs
      summary: 分页查询审计日志
      description: |
        需要权限 `audit:read`。

        审计日志**只读**：没有写入接口，也没有删除接口。写入由中间件与
        service 层完成，而「可以被删除的审计日志」在合规意义上等同于没有审计。

        `action` 取值：`auth.login`、`auth.login_failed`、`auth.logout`、
        `auth.refresh`、`auth.token_reuse_detected`、`auth.password_change`、
        `user.create`、`user.update`、`user.disable`、`user.enable`、
        `user.role_update`、`user.password_reset`、`asset.create`、
        `asset.update`、`asset.delete`、`asset.import`、`asset_group.create`、
        `asset_group.update`、`asset_group.move`、`asset_group.delete`、
        `dictionary.create`、`dictionary.update`、`dictionary.delete`。

        审计写入失败**不会**改变业务结果——调用到写审计这一步时业务通常已提交，
        把请求改判为失败会让用户以为操作没生效而重复提交，由此产生的重复数据
        比丢一条审计记录严重得多。代价是极端情况下会出现「有业务、无审计」，
        这一点由 Error 日志告警兜住。
      security:
        - SessionCookie: []
      parameters:
        - $ref: "#/components/parameters/Page"
        - $ref: "#/components/parameters/PageSize"
        - name: action
          in: query
          description: 按动作码精确过滤
          schema:
            type: string
            enum:
              - auth.login
              - auth.login_failed
              - auth.logout
              - auth.refresh
              - auth.token_reuse_detected
              - auth.password_change
              - user.create
              - user.update
              - user.disable
              - user.enable
              - user.role_update
              - user.password_reset
              - asset.create
              - asset.update
              - asset.delete
              - asset.import
              - asset_group.create
              - asset_group.update
              - asset_group.move
              - asset_group.delete
              - dictionary.create
              - dictionary.update
              - dictionary.delete
        - name: resource
          in: query
          description: 按资源类型过滤，如 `user`
          schema:
            type: string
        - name: user_id
          in: query
          description: 按操作人 ID 过滤
          schema:
            type: integer
            format: uint64
            minimum: 1
        - name: start_at
          in: query
          description: 起始时间（闭区间）。接受 RFC3339、`2006-01-02 15:04:05` 或 `2006-01-02`。
          schema:
            type: string
        - name: end_at
          in: query
          description: 结束时间（闭区间）。格式同 `start_at`。
          schema:
            type: string
      responses:
        "200":
          description: 审计日志分页结果，按时间倒序
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/OkEnvelope"
                  - type: object
                    required: [data]
                    properties:
                      data:
                        $ref: "#/components/schemas/AuditLogPage"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"

  # ============================================================ 业务字典
  /api/dictionaries:
    get:
      tags: [dictionaries]
      operationId: listDictionaries
      summary: 查询字典项
      description: |
        需要权限 `dictionary:read` **或** `asset:read`。后者是刻意放开的：
        填写资产表单时要从这里拉「启用中的资产类型」，而审计员这类角色
        只持有 `asset:read`；不放开的话资产表单的类型下拉会是空的。
        （与 `/api/roles` 的处理同理。）

        `enabled` 不传时返回**含停用项**的全部。这一点是刻意的：字典维护页
        必须看得到停用项，否则一个被停用的类型会从界面上凭空消失，用户既
        看不到它、也无法重新启用，会以为数据丢了。资产表单则显式传
        `enabled=1` —— 让「多显示一条停用项」（保存时会被明确拒绝）比
        「少显示一条本该有的项」（无从察觉）安全。
      security:
        - SessionCookie: []
      parameters:
        - name: category
          in: query
          description: 类别。省略表示全部类目。
          schema:
            $ref: "#/components/schemas/DictionaryCategory"
        - name: enabled
          in: query
          description: 传 `1` / `true` 时只返回启用项。无法识别的值按 `false` 处理，不报错。
          schema:
            type: boolean
            default: false
      responses:
        "200":
          description: 字典项列表（不分页：四类字典的总量在百级别）
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/OkEnvelope"
                  - type: object
                    required: [data]
                    properties:
                      data:
                        $ref: "#/components/schemas/DictionaryList"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"

    post:
      tags: [dictionaries]
      operationId: createDictionary
      summary: 新建字典项
      description: |
        需要权限 `dictionary:write`。审计动作 `dictionary.create`。

        `code` 必须匹配 `^[a-z][a-z0-9_]{0,63}$`，且**创建后不可修改**——
        资产表按 `code` 引用字典，允许改码会让历史资产瞬间指不到任何类型，
        而且没有任何报错（资产列表里的「资产类型」列会变成空白）。

        `weight` 的语义由 `category` 决定，见 `Dictionary.weight`：
        `asset_type` 的权重不参与风险计算，因此不接受传值，一律写 1。
        其余三类省略时默认 3（中性值，避免「不填 = 最低」让资产被系统性低估）。

        可能的失败码：`DICTIONARY_CATEGORY_INVALID`（400）、
        `DICTIONARY_CODE_TAKEN`（409）、`INVALID_PARAM`（400，码格式 / 权重越界）。
      security:
        - SessionCookie: []
          CSRFToken: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateDictionaryRequest"
      responses:
        "201":
          description: 创建成功
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/OkEnvelope"
                  - type: object
                    required: [data]
                    properties:
                      data:
                        $ref: "#/components/schemas/Dictionary"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "409":
          $ref: "#/components/responses/Conflict"

  /api/dictionaries/{id}:
    parameters:
      - $ref: "#/components/parameters/DictionaryId"
    patch:
      tags: [dictionaries]
      operationId: updateDictionary
      summary: 编辑字典项
      description: |
        需要权限 `dictionary:write`。审计动作 `dictionary.update`。

        全部字段可选，未出现的字段不修改。

        `code` 允许**原样回传**（前端编辑表单会带着它提交）；传了不同的值会
        返回 `DICTIONARY_CODE_IMMUTABLE`，而不是静默忽略——静默忽略会让用户
        以为改成功了，然后在资产列表里看到一个空白的类型名。

        `enabled` 是内置项的**正确停用方式**：停用不破坏任何引用
        （历史资产仍能翻译出中文名），只是不再出现在新建表单里。
      security:
        - SessionCookie: []
          CSRFToken: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdateDictionaryRequest"
      responses:
        "200":
          description: 更新后的字典项
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/OkEnvelope"
                  - type: object
                    required: [data]
                    properties:
                      data:
                        $ref: "#/components/schemas/Dictionary"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"

    delete:
      tags: [dictionaries]
      operationId: deleteDictionary
      summary: 删除字典项
      description: |
        需要权限 `dictionary:write`。审计动作 `dictionary.delete`。

        两道保护，都指向同一件事：**删除会让历史数据失去解释**。

        - 内置项不允许删（`DICTIONARY_BUILTIN_READONLY`，409）。它们是模板
          与流程的一部分，删掉会留下一批「类型名为空」的资产。
        - 仍被资产引用的资产类型不允许删（`DICTIONARY_IN_USE`，409），
          `message` 里会带上引用它的资产条数。

        这两种情况下正确的动作都是**停用**，因此两条错误提示里都写明了这一点。

        成功返回 `204`，无响应体。
      security:
        - SessionCookie: []
          CSRFToken: []
      responses:
        "204":
          description: 已删除（无响应体）
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"

  # ============================================================ 资产分组
  /api/asset-groups:
    get:
      tags: [asset-groups]
      operationId: listAssetGroups
      summary: 资产组树
      description: |
        需要权限 `asset:read`。

        返回**完整的树**（根节点数组，子节点在 `children` 里），不分页，
        也不做懒加载：资产组的规模是「一个企业的组织架构」，几十到几百个
        节点；而树控件、分组下拉、移动对话框三处都需要完整的父子关系，
        懒加载只会让这三处各写一遍「展开时再拉一层」的逻辑。

        `path` 是数据库里的物化路径（形如 `/1/4/9/`，按 ID 拼），
        对外暴露是为了让运维能对照数据库排查，**前端不应基于它做判断**。

        每个节点给两个数量，因为它们回答两个不同的问题：
        `asset_count` 是直属于该组的资产数（点进这个组能看到几条），
        `total_asset_count` 含子树（删这个组会不会被拦住）。
      security:
        - SessionCookie: []
      responses:
        "200":
          description: 资产组树（根节点数组）
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/OkEnvelope"
                  - type: object
                    required: [data]
                    properties:
                      data:
                        $ref: "#/components/schemas/AssetGroupList"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"

    post:
      tags: [asset-groups]
      operationId: createAssetGroup
      summary: 新建资产组
      description: |
        需要权限 `asset:write`。审计动作 `asset_group.create`。

        `parent_id` 省略或传 `null` 表示建为根组。同一父组下不允许重名
        （根组之间也不允许——数据库用生成列把 `parent_id IS NULL` 归一为 0
        后建唯一索引，因为 MySQL 的唯一索引把多个 NULL 视为互不相同，
        直接对 `parent_id` 建索引拦不住根组重名）。

        层级上限 8 层，超出返回 `ASSET_GROUP_DEPTH_EXCEEDED`（400）。
        可能的失败码：`ASSET_GROUP_NAME_TAKEN`（409）、`ASSET_GROUP_NOT_FOUND`（404）。
      security:
        - SessionCookie: []
          CSRFToken: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateAssetGroupRequest"
      responses:
        "201":
          description: 创建成功
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/OkEnvelope"
                  - type: object
                    required: [data]
                    properties:
                      data:
                        $ref: "#/components/schemas/AssetGroup"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"

  /api/asset-groups/{id}:
    parameters:
      - $ref: "#/components/parameters/AssetGroupId"
    patch:
      tags: [asset-groups]
      operationId: updateAssetGroup
      summary: 编辑资产组
      description: |
        需要权限 `asset:write`。审计动作 `asset_group.update`。

        **这里不能改 `parent_id`**：移动是独立端点
        （`POST /api/asset-groups/{id}/move`）。混在一起的话，「把组移到根」
        与「不移动」在 JSON 里都是 `parent_id` 缺失，无法区分——除非引入 `0`
        这个需要额外解释的魔法值。
      security:
        - SessionCookie: []
          CSRFToken: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdateAssetGroupRequest"
      responses:
        "200":
          description: 更新后的资产组
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/OkEnvelope"
                  - type: object
                    required: [data]
                    properties:
                      data:
                        $ref: "#/components/schemas/AssetGroup"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"

    delete:
      tags: [asset-groups]
      operationId: deleteAssetGroup
      summary: 删除资产组
      description: |
        需要权限 `asset:write`。审计动作 `asset_group.delete`。

        两道前置检查，顺序不能反：

        1. 仍有子组 → `ASSET_GROUP_HAS_CHILDREN`（409）；
        2. （含子树的）资产数 > 0 → `ASSET_GROUP_HAS_ASSETS`（409），
           `message` 里带上具体条数。

        先看子组再看资产：反过来的话，一个既有子组又有资产的组会报
        「里面还有资产」，用户把资产移走后仍然删不掉，多一轮无效往返。

        成功返回 `204`，无响应体。
      security:
        - SessionCookie: []
          CSRFToken: []
      responses:
        "204":
          description: 已删除（无响应体）
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"

  /api/asset-groups/{id}/move:
    post:
      tags: [asset-groups]
      operationId: moveAssetGroup
      summary: 移动资产组
      description: |
        需要权限 `asset:write`。审计动作 `asset_group.move`，
        明细里带 `from_path` / `to_path` / `depth_delta`。

        `parent_id` 省略或传 `null` 表示移到根。这里不需要三态：对「移动」
        这个动作来说，「没说移到哪」与「移到根」是同一件事，
        不存在「不修改父组」这个选项。

        三道校验，全部只在后端做：

        1. **防环**（`ASSET_GROUP_CYCLE`，400）：不能把组挂到它自己的
           子孙之下，否则那部分节点会从树上脱落，既不在任何根下，
           也永远无法通过界面找到。
        2. **防超深**（`ASSET_GROUP_DEPTH_EXCEEDED`，400）：搬过去之后
           被搬子树的**最深**那个后代仍须在 8 层以内。只查「新父深度 + 1」
           是不够的——被搬的可能是一棵三层子树。
        3. **防重名**（`ASSET_GROUP_NAME_TAKEN`，409）：新父组下不能已有同名子组。

        服务端在**一个事务**里同时更新 `parent_id` 与整棵子树的物化路径：
        中途失败会留下一棵路径与父子关系互不一致的树，那种数据靠人工
        很难修回来。
      security:
        - SessionCookie: []
          CSRFToken: []
      parameters:
        - $ref: "#/components/parameters/AssetGroupId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/MoveAssetGroupRequest"
      responses:
        "200":
          description: 移动后的资产组
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/OkEnvelope"
                  - type: object
                    required: [data]
                    properties:
                      data:
                        $ref: "#/components/schemas/AssetGroup"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"

  # ============================================================ 资产台账
  /api/assets:
    get:
      tags: [assets]
      operationId: listAssets
      summary: 分页查询资产
      description: |
        需要权限 `asset:read`。按 `id DESC` 排序（最近录入的在最前）。

        `keyword` 同时匹配 **名称 / 资产编号 / IP 地址 / 主机名 / 负责人**
        五个字段：台账里「按 IP 找机器」和「按人找资产」都是高频动作，
        只支持按名称检索等于逼用户导出到 Excel 里筛。`LIKE` 通配符已转义。

        `group_id` 默认**含子树**（`include_children` 默认 `true`）：
        点中「华东区」时用户期望看到它下面所有机房的资产，而不是只有直接
        挂在「华东区」上的那几条。这一点必须由后端实现——前端拿不到完整的
        父子关系，树若是懒加载就更拿不到。传 `include_children=0` 只看直挂。

        列表里的 `asset_type_name` / `group_name` 由服务端一次性补齐
        （而不是让前端逐行去查字典），因此**停用**的资产类型也能正确显示
        中文名，不会出现空白列。
      security:
        - SessionCookie: []
      parameters:
        - $ref: "#/components/parameters/Page"
        - $ref: "#/components/parameters/PageSize"
        - name: keyword
          in: query
          description: 关键字，匹配名称 / 资产编号 / IP 地址 / 主机名 / 负责人
          schema:
            type: string
            maxLength: 128
        - name: asset_type
          in: query
          description: 资产类型**码**（不是中文名），精确匹配
          schema:
            type: string
            maxLength: 64
        - name: status
          in: query
          description: 资产状态
          schema:
            $ref: "#/components/schemas/AssetStatus"
        - name: importance
          in: query
          description: 重要性 1–5。非法值返回 400。
          schema:
            type: integer
            minimum: 1
            maximum: 5
        - name: group_id
          in: query
          description: 资产组 ID。组不存在返回 `ASSET_GROUP_NOT_FOUND`，而不是静默返回空列表。
          schema:
            type: integer
            format: uint64
            minimum: 1
        - name: include_children
          in: query
          description: 与 `group_id` 搭配，是否连子组的资产一起看。默认 `true`。
          schema:
            type: boolean
            default: true
      responses:
        "200":
          description: 资产分页结果
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/OkEnvelope"
                  - type: object
                    required: [data]
                    properties:
                      data:
                        $ref: "#/components/schemas/AssetPage"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"

    post:
      tags: [assets]
      operationId: createAsset
      summary: 新建资产
      description: |
        需要权限 `asset:write`。审计动作 `asset.create`。

        校验要点：

        - `asset_type` 必须**存在且启用**（`ASSET_TYPE_UNKNOWN`，400）。
          停用的类型不允许被新资产选用，但已有资产可以继续沿用。
        - `asset_no` 可空。为空时写 `NULL` 而不是空串——唯一索引下多个
          `NULL` 互不冲突，因此「未编号」的资产可以有很多条；用空串的话
          第二条就会被拦住。非空时全局唯一（`ASSET_NO_TAKEN`，409）。
        - `port` 可空，取值 1–65535。`null` 与省略等价，都表示「未填写」。
        - `ip_address` 接受 IPv4 / IPv6 / CIDR / 主机名。**只含数字、点和
          冒号的字符串必须真的是 IP**：否则 `999.1.1.1` 会被当成一个合法的
          主机名收下，而那几乎必然是用户敲错了。
        - `importance` 省略按 3（中档），避免「不填 = 最低」让资产被系统性低估。
        - `status` 省略按 `in_use`。资产退役请改 `scrapped`，不要删除——
          台账的价值在于「这台机器曾经存在、已于某时退役」。
      security:
        - SessionCookie: []
          CSRFToken: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateAssetRequest"
      responses:
        "201":
          description: 创建成功
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/OkEnvelope"
                  - type: object
                    required: [data]
                    properties:
                      data:
                        $ref: "#/components/schemas/Asset"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"

  # ------------------------------------------------------------ 批量导入
  # 三个端点构成一条完整链路：下载模板 → 预览 → 确认导入。
  # 它们写在这里（`:id` 之前）只是为了阅读顺序；gin 的路由树能区分静态段
  # 与参数段，两者不会冲突。
  /api/assets/import/template:
    get:
      tags: [assets]
      operationId: downloadAssetImportTemplate
      summary: 下载导入模板
      description: |
        需要权限 `asset:write`（只有能导入的人才需要模板）。

        **这是全系统唯一的二进制响应，不套统一 JSON 信封。** 把 xlsx 塞进
        `data` 字段再让前端 base64 解码，会让「下载一个文件」多绕一大圈，
        而且契约里也无法表达真实的响应形状。

        产物是两张工作表：

        - `资产导入` —— 只有表头，**不含示例数据行**。带示例行的模板看起来
          更贴心，但用户很容易忘掉先删掉它，于是台账里凭空多出一条「示例资产」，
          那条记录看起来完全正常（名称、类型、IP 都齐全），事后几乎不可能
          被发现，还会被算进风险统计。
        - `填写说明` —— 逐列说明与示例，并列出当前**启用**的资产类型
          （码与名称），用户不必切到字典维护页去抄码。

        「资产编号」与「IP 地址」两列被强制为文本格式：不设的话 Excel 会把
        `00123` 按数字存，前导零在用户毫无察觉的情况下丢掉；IP 也可能被
        自动识别成日期。

        响应带 `Cache-Control: no-store`：模板里的类型清单会随字典变化，
        缓存住会让用户拿着一个引用了已停用类型的旧模板反复失败。
      security:
        - SessionCookie: []
      responses:
        "200":
          description: xlsx 文件。文件名通过 `Content-Disposition` 下发（含 RFC 5987 的 `filename*`，中文名不会乱码）。
          content:
            application/vnd.openxmlformats-officedocument.spreadsheetml.sheet:
              schema:
                type: string
                format: binary
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"

  /api/assets/import/preview:
    post:
      tags: [assets]
      operationId: previewAssetImport
      summary: 预览导入（不写入任何数据）
      description: |
        需要权限 `asset:write`。`multipart/form-data`，字段 `file` 必填。

        解析并校验，**不落库**。返回每一处不合格的 **源文件行号**（含表头、
        从 1 开始）、列名、原值与原因——用户打开 Excel 就能直接跳到那一行改。
        一行有多处错误时一次报全，而不是首错即返：后者会让用户改一处、传一次，
        一份 20 处错误的文件要传 20 遍。

        `create_missing_groups` 切换时前端重新调一次本接口即可（文件还在
        内存里），这样界面上的各种计数永远与真实状态一致，不需要前端自己
        去分类错误：

        | 取值 | 文件里引用的组不存在时 |
        | --- | --- |
        | `false`（默认） | 这些行记错误，同时把它们引用的组汇总进 `unmatched_groups` |
        | `true` | 这些行不记错误，缺失的组（含中间层级）汇总进 `groups_to_create`，在 commit 时建出来 |

        文件级失败（而不是行级）会走错误信封：`ASSET_IMPORT_FILE_MISSING`、
        `ASSET_IMPORT_FILE_TOO_LARGE`、`ASSET_IMPORT_FORMAT_INVALID`、
        `ASSET_IMPORT_MISSING_COLUMNS`（`message` 里列出缺了哪几列）、
        `ASSET_IMPORT_NO_ROWS`、`ASSET_IMPORT_TOO_MANY_ROWS`。

        格式按**魔数**嗅探而不是按扩展名：xlsx 本质是 zip，头四字节固定
        `PK\x03\x04`，因此把 xlsx 改名成 `.csv` 也能正确识别。CSV 会先试
        UTF-8，失败则按 GBK 解码（Excel 简体中文版「另存为 CSV」默认写 GBK），
        并处理 UTF-8 BOM。
      security:
        - SessionCookie: []
          CSRFToken: []
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required: [file]
              properties:
                file:
                  type: string
                  format: binary
                  description: "`.xlsx` 或 `.csv`，不超过 10 MB、5000 行、14 列"
                create_missing_groups:
                  type: boolean
                  default: false
                  description: 是否把文件里引用但系统中不存在的资产组视为「待创建」而不是错误
      responses:
        "200":
          description: 预览结果
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/OkEnvelope"
                  - type: object
                    required: [data]
                    properties:
                      data:
                        $ref: "#/components/schemas/AssetImportPreview"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"

  /api/assets/import/commit:
    post:
      tags: [assets]
      operationId: commitAssetImport
      summary: 确认导入
      description: |
        需要权限 `asset:write`。审计动作 `asset.import`
        （明细：`file_name` / `format` / `total_rows` / `imported` / `created_groups`）。

        请求体与 `preview` 完全相同：**重新上传同一份文件**。

        为什么是重新上传而不是复用 preview 的结果：服务端不持有任何导入会话
        状态。省一次上传的代价是引入一份有 TTL 的内存缓存（多副本部署时会话
        粘滞）或一张临时表（要多一套清理），而收益只是省掉几百 KB 的上行流量。
        校验规则只有一份，两阶段调用的是同一段解析代码——因此不存在
        「预览说没问题、提交却失败」的偏差。

        **导入是原子的：任一行不合格则一条都不写。** 半成功的导入会留下一个
        无法回答的问题——「台账里现在这批数据到底导完了还是没导完？」。
        用户拿着错误清单改完重传的成本，远低于事后逐条比对哪些进去了哪些没进去。

        因此失败有两种形态，**按下面的顺序判定**（一个文件可能同时命中两种，
        此时报第一种——它把完整的行级错误清单带回去，第二种只说明了一件事）：

        | 优先级 | 情况 | 状态码 | 错误码 | `data` |
        | --- | --- | --- | --- | --- |
        | 1 | 除「引用了不存在的组」之外还存在不合格行 | 409 | `ASSET_IMPORT_HAS_ERRORS` | 完整的预览结果（含全部行级错误） |
        | 2 | 唯一的阻塞原因就是「引用了不存在的组且未选自动创建」 | 400 | `ASSET_IMPORT_GROUP_NOT_FOUND` | 无（`message` 里列前 5 个组名） |

        第一种响应体是 `ErrorDetailEnvelope`，前端可以直接渲染出与预览阶段
        完全相同的错误表，而不是只弹一句「导入失败」。第二种是一行都没错的
        文件只缺组织结构，用户只需做一个动作（勾选自动创建，或先建组）。
      security:
        - SessionCookie: []
          CSRFToken: []
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required: [file]
              properties:
                file:
                  type: string
                  format: binary
                create_missing_groups:
                  type: boolean
                  default: false
      responses:
        "200":
          description: 导入完成
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/OkEnvelope"
                  - type: object
                    required: [data]
                    properties:
                      data:
                        $ref: "#/components/schemas/AssetImportResult"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "409":
          $ref: "#/components/responses/ConflictWithImportDetail"

  /api/assets/{id}:
    parameters:
      - $ref: "#/components/parameters/AssetId"
    get:
      tags: [assets]
      operationId: getAsset
      summary: 查询资产详情
      description: 需要权限 `asset:read`。
      security:
        - SessionCookie: []
      responses:
        "200":
          description: 资产详情
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/OkEnvelope"
                  - type: object
                    required: [data]
                    properties:
                      data:
                        $ref: "#/components/schemas/Asset"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"

    patch:
      tags: [assets]
      operationId: updateAsset
      summary: 编辑资产
      description: |
        需要权限 `asset:write`。审计动作 `asset.update`（明细里带改动了哪些字段）。

        **三个可空字段（`asset_no` / `group_id` / `port`）是三态的**，
        这是本接口唯一需要仔细看的地方：

        | 字段 | 不传 | 传 `null` | 传值 |
        | --- | --- | --- | --- |
        | `asset_no` | 不修改 | 清空（写 `NULL`，即「未编号」） | 设为该编号 |
        | `group_id` | 不修改 | 移出分组 | 挂到该组下 |
        | `port` | 不修改 | 清空 | 设为该端口 |

        用「传 0 表示清空」之类的哨兵值也能跑通，但会把实现细节泄漏到契约里
        （`port` 的 schema 就得写 `minimum: 0`，而 0 不是合法端口）。三态让
        契约可以诚实地写成 `type: [integer, "null"]`。

        其余字符串字段是「不传 = 不修改，传空串 = 清空」，没有第三种状态。

        一条容易忽略的规则：**只在 `asset_type` 真的变了的时候**校验
        「存在且启用」。否则一个用着已停用类型的资产永远保存不了——用户明明
        只是在改备注，却被告知「资产类型不存在」。
      security:
        - SessionCookie: []
          CSRFToken: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdateAssetRequest"
      responses:
        "200":
          description: 更新后的资产
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/OkEnvelope"
                  - type: object
                    required: [data]
                    properties:
                      data:
                        $ref: "#/components/schemas/Asset"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"

    delete:
      tags: [assets]
      operationId: deleteAsset
      summary: 删除资产
      description: |
        需要权限 `asset:write`。审计动作 `asset.delete`。

        语义是「**修正误录入**」。资产退役请把状态改成 `scrapped` ——
        台账需要留下「这台机器曾经存在、已于某时退役」这个事实，删掉就
        丢掉了一段历史记录。将来评估记录引用资产之后，这里的物理删除
        会被外键拦下。

        成功返回 `204`，无响应体。
      security:
        - SessionCookie: []
          CSRFToken: []
      responses:
        "204":
          description: 已删除（无响应体）
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"

  # ============================================================ 扫描文件（P3）
  /api/files:
    get:
      tags: [files]
      operationId: listScanFiles
      summary: 分页查询扫描文件
      description: |
        需要权限 `file:read`。按 `id DESC` 排序（最近上传的在最前）。

        `parse_status` 过滤取值 `unparsed` / `parsed` / `failed`，
        不传表示全部。列表里的 `vuln_count` 是该文件解析入库的漏洞条数。
      security:
        - SessionCookie: []
      parameters:
        - $ref: "#/components/parameters/Page"
        - $ref: "#/components/parameters/PageSize"
        - name: keyword
          in: query
          description: 关键字，匹配原始文件名
          schema:
            type: string
            maxLength: 128
        - name: parse_status
          in: query
          description: 解析状态过滤，不传表示全部
          schema:
            $ref: "#/components/schemas/ScanParseStatus"
      responses:
        "200":
          description: 文件分页结果
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/OkEnvelope"
                  - type: object
                    required: [data]
                    properties:
                      data:
                        $ref: "#/components/schemas/ScanFilePage"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"

  /api/files/upload:
    post:
      tags: [files]
      operationId: uploadScanFile
      summary: 上传扫描报告
      description: |
        需要权限 `file:write`。审计动作 `file.upload`。

        **三重校验**（顺序即报错优先级）：扩展名白名单
        （`.nessus` / `.xml` / `.xlsx` / `.csv`）→ MIME 白名单 → 魔数。
        内容与扩展名不一致时以内容为准拒绝——这是 webshell 与
        「改后缀伪装」类攻击的主闸门。

        **哈希去重是幂等的**：同一内容重复上传不报错，返回已有记录，
        响应里的 `duplicate=true` 标记这种情况。磁盘上同一份内容永远
        只有一份物理文件。

        体积上限 10 MB（`FILE_TOO_LARGE`，413）。
      security:
        - SessionCookie: []
          CSRFToken: []
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required: [file]
              properties:
                file:
                  type: string
                  format: binary
                  description: 扫描报告文件（.nessus / .xml / .xlsx / .csv）
      responses:
        "200":
          description: 上传成功（`data.file` 为文件记录，`data.duplicate` 表示是否为重复上传）
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/OkEnvelope"
                  - type: object
                    required: [data]
                    properties:
                      data:
                        $ref: "#/components/schemas/UploadScanFileResult"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "413":
          $ref: "#/components/responses/RequestEntityTooLarge"

  /api/files/{id}:
    parameters:
      - $ref: "#/components/parameters/ScanFileId"
    get:
      tags: [files]
      operationId: getScanFile
      summary: 查询文件详情
      description: 需要权限 `file:read`。
      security:
        - SessionCookie: []
      responses:
        "200":
          description: 文件详情
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/OkEnvelope"
                  - type: object
                    required: [data]
                    properties:
                      data:
                        $ref: "#/components/schemas/ScanFile"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"

    delete:
      tags: [files]
      operationId: deleteScanFile
      summary: 删除扫描文件
      description: |
        需要权限 `file:write`。审计动作 `file.delete`。

        **默认拒绝删除仍有漏洞引用的文件**（`FILE_IN_USE`，409）——
        漏洞是评估的输入，文件一删「这些漏洞从哪来」就断了线。
        `?force=true` 时在一个事务里级联删除该文件解析出的全部漏洞
        （漏洞-资产关联随数据库外键清理），响应照常 200。

        物理文件随记录一起删除；数据库删除成功而磁盘删除失败时记录
        错误日志但**不回滚**——残留文件无人引用，无害。
      security:
        - SessionCookie: []
          CSRFToken: []
      parameters:
        - name: force
          in: query
          description: 为 `true` 时级联删除该文件解析出的漏洞。默认 `false`。
          schema:
            type: boolean
            default: false
      responses:
        "200":
          description: 删除成功（无业务数据）
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/OkEnvelope"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"

  /api/files/{id}/download:
    parameters:
      - $ref: "#/components/parameters/ScanFileId"
    get:
      tags: [files]
      operationId: downloadScanFile
      summary: 下载文件内容
      description: |
        需要权限 `file:read`。

        响应为 `application/octet-stream` + `Content-Disposition: attachment`，
        并带 `X-Content-Type-Options: nosniff`。上传目录不被任何静态文件
        服务暴露，这是**唯一**的下载通道——权限校验在这里，不在磁盘上。
      security:
        - SessionCookie: []
      responses:
        "200":
          description: 文件二进制内容
          content:
            application/octet-stream:
              schema:
                type: string
                format: binary
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"

  # ------------------------------------------------------------ 解析
  /api/parser/template:
    get:
      tags: [parser]
      operationId: getVulnImportTemplate
      summary: 下载漏洞导入模板
      description: |
        需要权限 `file:write`（下载模板是解析流程的第一步）。

        通用表格格式（xlsx）的配套：第一张表只有表头，第二张表是逐列说明。
        与资产导入模板同构。
      security:
        - SessionCookie: []
      responses:
        "200":
          description: 模板文件（xlsx）
          content:
            application/vnd.openxmlformats-officedocument.spreadsheetml.sheet:
              schema:
                type: string
                format: binary
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"

  /api/parser/preview:
    post:
      tags: [parser]
      operationId: previewScanParse
      summary: 解析扫描报告（预览，不写入）
      description: |
        需要权限 `file:write`。**不产生审计**：这个操作只能用 POST
        （要带 `file_id`），但它只读不写，没有可审计的事件。

        两阶段解析的第一阶段。支持三种格式（按根元素 / 魔数自动识别）：
        Nessus XML、OpenVAS XML、通用表格（xlsx / csv）。同一个文件可以
        反复预览——预览不改变 `parse_status`，先补资产再看匹配情况的
        工作流是被支持的。

        格式是 XML 时 `errors` 恒为空（整体报错，见 415）；格式是表格时
        行级错误的 `row` 是**源文件行号**（含表头，从 1 开始）。
      security:
        - SessionCookie: []
          CSRFToken: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ParseRequest"
      responses:
        "200":
          description: 解析预览
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/OkEnvelope"
                  - type: object
                    required: [data]
                    properties:
                      data:
                        $ref: "#/components/schemas/VulnParsePreview"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"
        "415":
          $ref: "#/components/responses/UnsupportedMediaType"

  /api/parser/commit:
    post:
      tags: [parser]
      operationId: commitScanParse
      summary: 解析入库（两阶段解析的第二阶段）
      description: |
        需要权限 `file:write`。审计动作 `file.parse`。

        **commit 重新解析重新校验，不复用预览结果**（服务端不持有解析
        会话状态）。预览之后台账可能变了——新资产上线让原来匹配不上的
        IP 现在能匹配，重新解析恰恰能让这种改善生效。

        **原子性**：任一行不合格时**一条都不写**，返回
        `VULN_HAS_ERRORS`（409）+ 完整预览结果挂进 `data`。
        两个并发 commit 由 `parse_status` 的条件更新裁决，后到者得
        `FILE_ALREADY_PARSED`（409）。

        **自动关联**：按漏洞的 `host_ip` 与资产台账的 `ip_address`
        精确匹配，命中即建 `vuln_asset_links`（`matched_by=auto`）。
        同 IP 多资产时全部挂上；未命中的 IP 列在 `unmatched_ips` 里
        供人工补挂，**不阻塞**入库。
      security:
        - SessionCookie: []
          CSRFToken: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ParseRequest"
      responses:
        "200":
          description: 解析入库成功
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/OkEnvelope"
                  - type: object
                    required: [data]
                    properties:
                      data:
                        $ref: "#/components/schemas/VulnParseResult"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          description: 存在不合格条目（`VULN_HAS_ERRORS`，data 带完整预览）或文件已解析（`FILE_ALREADY_PARSED`）
          content:
            application/json:
              schema:
                oneOf:
                  - $ref: "#/components/schemas/ErrorDetailEnvelope"
                  - $ref: "#/components/schemas/ErrorEnvelope"
        "415":
          $ref: "#/components/responses/UnsupportedMediaType"

  # ============================================================ 漏洞清单（P3）
  /api/vulnerabilities:
    get:
      tags: [vulnerabilities]
      operationId: listVulnerabilities
      summary: 分页查询漏洞
      description: |
        需要权限 `vulnerability:read`。按 `severity DESC, id DESC` 排序
        （最严重的在最前）。

        `source_file_id` 的三态约定：**不传 = 不限；传 `0` = 只看手工录入**
        （`source_file_id IS NULL`）；传正整数 = 按来源文件过滤。
        `linked` 的两态：`true` = 已挂到至少一个资产，`false` = 未挂。

        `keyword` 同时匹配名称 / CVE / 主机 IP / 服务名。
      security:
        - SessionCookie: []
      parameters:
        - $ref: "#/components/parameters/Page"
        - $ref: "#/components/parameters/PageSize"
        - name: keyword
          in: query
          description: 关键字，匹配名称 / CVE / 主机 IP / 服务名
          schema:
            type: string
            maxLength: 128
        - name: severity
          in: query
          description: 严重程度 1–5，精确匹配
          schema:
            type: integer
            minimum: 1
            maximum: 5
        - name: source_file_id
          in: query
          description: 来源文件 ID；传 `0` 表示只看手工录入
          schema:
            type: integer
            format: uint64
            minimum: 0
        - name: linked
          in: query
          description: 是否已关联到至少一个资产
          schema:
            type: boolean
      responses:
        "200":
          description: 漏洞分页结果
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/OkEnvelope"
                  - type: object
                    required: [data]
                    properties:
                      data:
                        $ref: "#/components/schemas/VulnPage"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"

    post:
      tags: [vulnerabilities]
      operationId: createVulnerability
      summary: 手工录入漏洞
      description: |
        需要权限 `vulnerability:write`。审计动作 `vuln.create`。

        手工录入的漏洞 `source_file_id` 为 `null`。`severity` 省略时
        依次尝试 `severity_raw` 的等级词（严重/高/中/低/信息），
        都没有则按 3（中档）——「不填 = 最低」会系统性低估风险。
      security:
        - SessionCookie: []
          CSRFToken: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateVulnerabilityRequest"
      responses:
        "201":
          description: 创建成功
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/OkEnvelope"
                  - type: object
                    required: [data]
                    properties:
                      data:
                        $ref: "#/components/schemas/Vulnerability"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"

  /api/vulnerabilities/{id}:
    parameters:
      - $ref: "#/components/parameters/VulnerabilityId"
    get:
      tags: [vulnerabilities]
      operationId: getVulnerability
      summary: 查询漏洞详情（含关联资产）
      description: 需要权限 `vulnerability:read`。`data.assets` 按关联建立顺序排列，含 `matched_by` 来源。
      security:
        - SessionCookie: []
      responses:
        "200":
          description: 漏洞详情与关联资产
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/OkEnvelope"
                  - type: object
                    required: [data]
                    properties:
                      data:
                        $ref: "#/components/schemas/VulnerabilityDetail"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"

    patch:
      tags: [vulnerabilities]
      operationId: updateVulnerability
      summary: 编辑漏洞
      description: |
        需要权限 `vulnerability:write`。审计动作 `vuln.update`。

        解析产出的漏洞同样允许编辑——扫描器的结论只是输入，评估人员的
        修正是分析的一部分；审计里留有痕迹。

        `port` 是三态字段（不传 = 不修改；`null` 或 `0` = 清空；传值 = 设定）。
        其余字符串字段「不传 = 不修改，传空串 = 清空」。
      security:
        - SessionCookie: []
          CSRFToken: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdateVulnerabilityRequest"
      responses:
        "200":
          description: 更新后的漏洞
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/OkEnvelope"
                  - type: object
                    required: [data]
                    properties:
                      data:
                        $ref: "#/components/schemas/Vulnerability"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"

    delete:
      tags: [vulnerabilities]
      operationId: deleteVulnerability
      summary: 删除漏洞
      description: |
        需要权限 `vulnerability:write`。审计动作 `vuln.delete`。

        主要供手工录入的错条目使用；解析产出的漏洞建议走
        「文件删除 + force」整批清理。漏洞-资产关联随数据库外键清理。
      security:
        - SessionCookie: []
          CSRFToken: []
      responses:
        "200":
          description: 删除成功（无业务数据）
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/OkEnvelope"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"

  /api/vulnerabilities/{id}/assets:
    parameters:
      - $ref: "#/components/parameters/VulnerabilityId"
    post:
      tags: [vulnerabilities]
      operationId: setVulnerabilityAssets
      summary: 设置漏洞的手动资产关联
      description: |
        需要权限 `vulnerability:write`。审计动作 `vuln.link`。

        **整体替换**语义：`asset_ids` 是手动关联的最终状态，
        传空数组 = 清空全部手动关联。**自动关联（`matched_by=auto`）
        不受影响**——它由解析流程负责，手动操作无权覆盖，
        否则一次误操作就丢失了自动匹配的全部结果。

        传不存在的资产 ID 返回 404（`ASSET_NOT_FOUND`）——「要挂的东西不存在」
        是资源缺失而不是参数格式错误，与资产接口本身的口径保持一致。
      security:
        - SessionCookie: []
          CSRFToken: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SetVulnAssetsRequest"
      responses:
        "200":
          description: 设置后的关联列表
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/OkEnvelope"
                  - type: object
                    required: [data]
                    properties:
                      data:
                        type: object
                        required: [assets]
                        properties:
                          assets:
                            type: array
                            items:
                              $ref: "#/components/schemas/VulnAsset"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"

  # ========================================================= 风险评估（P4）
  /api/assessments:
    get:
      tags: [assessments]
      operationId: listAssessments
      summary: 评估任务列表
      description: 需要权限 `assessment:read`。
      security:
        - SessionCookie: []
      parameters:
        - $ref: "#/components/parameters/Page"
        - $ref: "#/components/parameters/PageSize"
        - name: keyword
          in: query
          description: 按名称或说明模糊匹配
          schema:
            type: string
        - name: status
          in: query
          description: 按状态过滤，不传表示不限
          schema:
            $ref: "#/components/schemas/AssessmentStatus"
      responses:
        "200":
          description: 评估任务分页
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AssessmentPage"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
    post:
      tags: [assessments]
      operationId: createAssessment
      summary: 新建评估任务
      description: |
        需要权限 `assessment:write`。审计动作 `assessment.create`。

        新建时**必须**指定评估范围：`all` 全量（此时 `scope_ref` 必须为空）、
        `group` 按资产组（自动展开子组）、`custom` 手工指定资产。
        三种范围都会排除已报废（`scrapped`）的资产——范围决定「评哪些」，
        状态决定「还值不值得评」，混在一起会让同一个资产在不同范围下
        得到互相矛盾的结论。

        `default_threat_code` 留空表示未指定威胁，引擎按中档 `T=3` 处理
        （与「默认重要性 3、默认严重程度 3」同一条原则：不填不等于最低）。
      security:
        - SessionCookie: []
          CSRFToken: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateAssessmentRequest"
      responses:
        "201":
          description: 创建成功
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/OkEnvelope"
                  - type: object
                    required: [data]
                    properties:
                      data:
                        $ref: "#/components/schemas/Assessment"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"

  /api/assessments/preview:
    post:
      tags: [assessments]
      operationId: previewAssessment
      summary: 试算（只读，不落库）
      description: |
        需要权限 `assessment:read`。

        **刻意不写审计**（`MarkAuditSkipped`）：用户在评估执行页拖动范围会
        反复调用它，把每一次试算都记进审计，只会把真正需要留痕的操作淹掉。

        与 `calculate` 共用同一份计算实现（`internal/pkg/riskengine`）——
        这是「界面值 = 落库值」在实现层面的保证：系统里不允许存在第二条
        风险计算路径，否则三处一致性迟早会在某个边界条件下分叉，且分叉不报错。

        可选传入 `asset_weight` / `thresholds` 做阈值预览；不传则用当前系统配置。
      security:
        - SessionCookie: []
          CSRFToken: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/PreviewAssessmentRequest"
      responses:
        "200":
          description: 试算结果
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/OkEnvelope"
                  - type: object
                    required: [data]
                    properties:
                      data:
                        $ref: "#/components/schemas/PreviewAssessmentResult"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"

  /api/assessments/{id}:
    parameters:
      - $ref: "#/components/parameters/AssessmentId"
    get:
      tags: [assessments]
      operationId: getAssessment
      summary: 评估任务详情
      description: 需要权限 `assessment:read`。
      security:
        - SessionCookie: []
      responses:
        "200":
          description: 评估任务
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/OkEnvelope"
                  - type: object
                    required: [data]
                    properties:
                      data:
                        $ref: "#/components/schemas/Assessment"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
    patch:
      tags: [assessments]
      operationId: updateAssessment
      summary: 编辑评估任务
      description: |
        需要权限 `assessment:write`。审计动作 `assessment.update`。

        允许改名称、说明、范围与默认威胁，但**不会自动重算**，也不会把状态
        退回 `draft`：改完仍停在原状态，由用户显式点「重新计算」。
        自动重算会让「我明明只改了个名字，结果怎么全变了」变成一次
        找不到原因的投诉。

        未传的字段保持不变（每个字段都是可空的独立字段，而不是整体替换）。
      security:
        - SessionCookie: []
          CSRFToken: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdateAssessmentRequest"
      responses:
        "200":
          description: 更新后的评估任务
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/OkEnvelope"
                  - type: object
                    required: [data]
                    properties:
                      data:
                        $ref: "#/components/schemas/Assessment"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
    delete:
      tags: [assessments]
      operationId: deleteAssessment
      summary: 删除评估任务
      description: |
        需要权限 `assessment:write`。审计动作 `assessment.delete`。

        风险项与资产汇总由外键 `ON DELETE CASCADE` 一并清理——
        它们相对于评估任务是**派生数据**（与资产、漏洞这两类事实来源
        区别对待：删掉后两者不会改写历史结论）。
      security:
        - SessionCookie: []
          CSRFToken: []
      responses:
        "200":
          description: 删除成功（`data` 为 `null`）
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/OkEnvelope"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"

  /api/assessments/{id}/calculate:
    parameters:
      - $ref: "#/components/parameters/AssessmentId"
    post:
      tags: [assessments]
      operationId: calculateAssessment
      summary: 计算并落库
      description: |
        需要权限 `assessment:write`。审计动作 `assessment.calculate`。

        **幂等**：重复执行是覆盖而不是追加（事务内先清空本评估的结果行再写入）。
        重算只刷新「算出来的部分」——用户逐条覆盖过的威胁（`threat_source=manual`）
        会被保留，否则一次「重新计算」就悄悄回退了他半小时的调整。

        计算时把当前权重与阈值写入 `config_snapshot`，此后该评估永久
        可复现：改系统配置只会影响**之后**的计算。
      security:
        - SessionCookie: []
          CSRFToken: []
      responses:
        "200":
          description: 计算后的评估任务（含汇总列）
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/OkEnvelope"
                  - type: object
                    required: [data]
                    properties:
                      data:
                        $ref: "#/components/schemas/Assessment"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"

  /api/assessments/{id}/risk-items:
    parameters:
      - $ref: "#/components/parameters/AssessmentId"
    get:
      tags: [assessments]
      operationId: listAssessmentRiskItems
      summary: 风险项分页（矩阵下钻）
      description: |
        需要权限 `assessment:read`。

        `importance` 与 `severity` 是**矩阵的横纵轴**（1–5 的原始档位），
        点某个格子进来时按它们过滤。用原始档位而不是 A / T / V：
        档位不受权重配置影响，改一次权重系数不会让矩阵里的格子整体位移，
        结构稳定，只有颜色变。
      security:
        - SessionCookie: []
      parameters:
        - $ref: "#/components/parameters/Page"
        - $ref: "#/components/parameters/PageSize"
        - name: importance
          in: query
          description: 资产重要性档位 1–5
          schema:
            type: integer
            minimum: 1
            maximum: 5
        - name: severity
          in: query
          description: 漏洞严重程度档位 1–5
          schema:
            type: integer
            minimum: 1
            maximum: 5
        - name: level
          in: query
          description: 按风险等级过滤
          schema:
            $ref: "#/components/schemas/RiskLevel"
        - name: keyword
          in: query
          description: 按资产名称 / IP / 漏洞名称 / CVE 模糊匹配
          schema:
            type: string
      responses:
        "200":
          description: 风险项分页
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RiskItemPage"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"

  /api/assessments/{id}/risk-items/{itemId}:
    parameters:
      - $ref: "#/components/parameters/AssessmentId"
      - $ref: "#/components/parameters/RiskItemId"
    patch:
      tags: [assessments]
      operationId: setRiskItemThreat
      summary: 逐项覆盖风险项的威胁
      description: |
        需要权限 `assessment:write`。审计动作 `assessment.risk_item_update`。

        改的是**那次评估的结果**，不是漏洞本身——同一条漏洞在两次评估里
        可以有不同威胁（这正是 D2 决策：任务级默认威胁 + 风险项可逐项覆盖）。

        覆盖后该条会立即重算，并连带重算它所在资产的风险等级与整个评估的
        汇总列，否则「界面值 = 落库值」从这一刻起就不成立了。

        重算用**该评估的配置快照**而不是当前配置：这条风险项属于那次评估。
        路径里的评估 ID 与风险项不匹配时返回 404（与「风险项不存在」完全一样，
        不让调用方据此探测别的评估里有哪些风险项）。
      security:
        - SessionCookie: []
          CSRFToken: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SetRiskItemThreatRequest"
      responses:
        "200":
          description: 重算后的风险项
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/OkEnvelope"
                  - type: object
                    required: [data]
                    properties:
                      data:
                        $ref: "#/components/schemas/RiskItem"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"

  /api/assessments/{id}/matrix:
    parameters:
      - $ref: "#/components/parameters/AssessmentId"
    get:
      tags: [assessments]
      operationId: getAssessmentMatrix
      summary: 风险矩阵（资产重要性 × 漏洞严重程度）
      description: |
        需要权限 `assessment:read`。

        返回**全部 25 个格子**（空格 `count=0`）而不是稀疏的命中格子：
        热力图的形状必须固定，否则同一个评估在两次加载之间格子位置会变，
        而「昨天这块是红的」这种判断依赖于位置稳定。

        每个格子的 `level` 由格子内最大 R 与**该评估的快照配置**判定；
        没有风险项的格子为 `very_low`。
      security:
        - SessionCookie: []
      responses:
        "200":
          description: 风险矩阵
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/OkEnvelope"
                  - type: object
                    required: [data]
                    properties:
                      data:
                        $ref: "#/components/schemas/RiskMatrix"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"

  /api/assessments/{id}/export-data:
    parameters:
      - $ref: "#/components/parameters/AssessmentId"
    get:
      tags: [assessments]
      operationId: exportAssessmentData
      summary: 导出报告数据（不渲染文档）
      description: |
        需要权限 `assessment:read`。审计动作 `assessment.export`——
        导出是数据离开系统边界的敏感动作，与「看一眼列表」不是一回事。

        **这个接口在 P4 就存在，是为了让验收能真正收口。**
        `docs/01` 给 P4 的验收标志是「界面值 = 落库值 = 报告值」三者一致，
        而报告要到 P5 的 docgen 才渲染。本接口返回 P5 渲染器将要消费的
        那一份结构化数据，于是三方等式在本阶段就能逐条比对
        （`scripts/verify-assess.sh` 的核心断言）。

        风险项超过 5000 条时返回 `ASSESSMENT_EXPORT_TOO_LARGE`，
        而**不是**悄悄截断：截断的报告看起来是完整的，比报错的报告危险得多。
      security:
        - SessionCookie: []
      responses:
        "200":
          description: 报告数据
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/OkEnvelope"
                  - type: object
                    required: [data]
                    properties:
                      data:
                        $ref: "#/components/schemas/AssessmentExportData"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"

  # ======================================================= 报告导出（P5）
  /api/reports/export:
    post:
      tags: [reports]
      operationId: exportReport
      summary: 导出报告文件（Word / Excel / PDF）
      description: |
        需要权限 `report:read`。审计动作 `report.export`。

        ## 三种格式，三条技术路线

        | `format` | 产物 | 渲染方式 | 依赖外部服务 |
        | --- | --- | --- | --- |
        | `word` | `.docx` | docgen（C#/OpenXML） | 是 |
        | `excel` | `.xlsx` | excelize（纯 Go，进程内） | **否** |
        | `pdf` | `.pdf` | HTML → Gotenberg（Chromium） | 是 |

        Excel 那一行值得单独说：它**不依赖任何上游服务**。因此 docgen 或
        Gotenberg 挂掉时，`word` / `pdf` 返回 503，而 `excel` 照常可用。
        这不是刻意设计出来的特性，但它确实是对的——一个不需要外部依赖的
        功能，不该被外部依赖拖垮。

        ## 为什么是 POST 而不是 GET

        下载的是一份**会离开系统边界**的文件，它必须留审计。用 GET 的话：

        - 浏览器或聊天软件里的一个 `<a href="...">` 链接就能触发一次导出
          （顶层导航会带 Cookie，`SameSite=Lax` 不拦导航），于是一次
          「点了个不明链接」就变成一条 `report.export` 审计。审计里出现
          **没发生过**的动作，比漏记一条更糟——它会让人怀疑整套审计。
        - CSRF 中间件只保护非安全方法，GET 天然绕过它。
        - 导出是重操作（要起 .NET 与 Chromium 进程），不该被预取器、
          爬虫、浏览器预加载随手触发。

        ## 未计算不可导出

        评估任务必须处于 `calculated` 状态，否则返回 409
        `REPORT_NOT_CALCULATED`。**这不是防御性检查，而是防一个很危险的
        错觉**：草稿任务没有结果行，硬渲染会得到一份「0 条风险项」的报告，
        而那份报告看起来完全正常（有封面、有目录、有矩阵、有说明）。
        收到它的人不会想到「这份评估其实还没跑」，只会得出「这些资产
        全都没风险」的结论。

        ## 文件名与响应头

        响应是二进制，`Content-Type` 随 `format` 变化，
        `Content-Disposition: attachment` 同时给出 RFC 5987 的 `filename*`
        （UTF-8 百分号编码，中文评估名不乱码）与一个纯 ASCII 的兜底
        `filename`。文件名形如 `{评估名}_{格式}_{YYYYMMDD-HHmm}.{ext}`。

        ## 失败时的响应不是二进制

        ⚠️ 这个端点成功时返回二进制、失败时返回 JSON 错误信封。前端用
        `responseType: 'blob'` 收响应，因此拿到的是 Blob 形式的错误体，
        必须自己按 Blob 读回来再 `JSON.parse`。

        ## 不落库

        报告**不落库**，生成后直接流式返回。可追溯性由三处承担：
        审计里的 `report.export`（含文件名、字节数、评估名与格式）、
        报告页脚与封面上的生成时间与导出人、以及报告里冻结的配置快照。
      security:
        - SessionCookie: []
          CSRFToken: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ExportReportRequest"
      responses:
        "200":
          description: |
            报告文件二进制内容。具体 `Content-Type` 取决于 `format`：
            `word` → `application/vnd.openxmlformats-officedocument.wordprocessingml.document`，
            `excel` → `application/vnd.openxmlformats-officedocument.spreadsheetml.sheet`，
            `pdf` → `application/pdf`。
          headers:
            Content-Disposition:
              description: |
                `attachment; filename="<ASCII 兜底名>"; filename*=UTF-8''<百分号编码的中文名>`。
                前端应优先取 `filename*`，取不到再退回 `filename`。
              schema:
                type: string
          content:
            application/vnd.openxmlformats-officedocument.wordprocessingml.document:
              schema:
                type: string
                format: binary
            application/vnd.openxmlformats-officedocument.spreadsheetml.sheet:
              schema:
                type: string
                format: binary
            application/pdf:
              schema:
                type: string
                format: binary
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"
        "503":
          $ref: "#/components/responses/ServiceUnavailable"

  # ======================================================= 系统配置（P4）
  /api/system/configs:
    get:
      tags: [system-configs]
      operationId: getSystemConfigs
      summary: 读取风险模型配置
      description: |
        需要权限 `system:read` 或 `assessment:read`。

        读接口刻意放宽到 `assessment:read`：评估员没有系统设置权限，
        但他在评估执行页必须能看到当前阈值才能理解结果。
        与 `/roles`、`/dictionaries` 是同一处理。写接口只认 `system:write`。
      security:
        - SessionCookie: []
      responses:
        "200":
          description: 风险模型配置
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/OkEnvelope"
                  - type: object
                    required: [data]
                    properties:
                      data:
                        $ref: "#/components/schemas/SystemConfigView"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "500":
          description: |
            配置表本身不合法（`RISK_CONFIG_INVALID`）：缺行、值不是数字，
            或阈值被手工改成了倒序。报 500 而不是 400——请求没有任何问题，
            是部署状态坏了，把它伪装成「参数错误」会让用户反复检查自己的输入。
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
    patch:
      tags: [system-configs]
      operationId: updateSystemConfigs
      summary: 更新风险模型配置
      description: |
        需要权限 `system:write`。审计动作 `system_config.update`。

        ⚠️ 这一类操作会让**之后**的评估结果与之前的不可比，属高敏感操作：
        因此已计算过的评估用的是它自己的配置快照，不会被这里改动影响。

        校验在写库**之前**完成：四个阈值必须严格递减且 `low ≥ 1`。
        不满足返回 `RISK_CONFIG_INVALID`，库不会留下半改状态。
        修改 `risk.model`（模型标识）返回 `RISK_CONFIG_READONLY`。

        未传的字段保持不变。
      security:
        - SessionCookie: []
          CSRFToken: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdateSystemConfigRequest"
      responses:
        "200":
          description: 更新后的配置
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/OkEnvelope"
                  - type: object
                    required: [data]
                    properties:
                      data:
                        $ref: "#/components/schemas/SystemConfigView"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"

  # =============================================== 整改跟踪与首页统计（P6）
  #
  # ▍头号设计陷阱：整改单的身份是 (asset_id, vuln_id)，不是 risk_item_id
  #
  # P4 的 calculate 是「先清后写」——重算一次，`risk_items.id` **整批变化**。
  # 若整改单外键指向 risk_item_id，一次重算就会**静默断链**：单子还在，
  # 它指向的风险项已经不存在，而没有任何报错。因此：
  #
  #   - 业务身份 = (asset_id, vuln_id)，这两个 ID 不随重算变化；
  #   - assessment_id / risk_item_id 降级为「发现出处」，允许失效；
  #   - 另冗余一组快照列（asset_name / asset_ip / vuln_title / vuln_cve_ids /
  #     risk_level / risk_value_r），保证目标被删除、出处失效之后单子仍可读。
  #
  # ▍逾期不落库
  #
  # 表里只存 `due_date DATE`，「是否逾期」每次现算。落一个布尔列需要每日
  # 定时任务，任务一挂库里的数字就开始静默说谎，而那个数字会被仪表盘直接
  # 呈现给管理层。判定规则三条：只有未闭环才可能逾期、日期归一到零点再比、
  # 未设期限（null）永远不算逾期。
  #
  # ▍状态机
  #
  #   pending → in_progress | resolved | accepted
  #   in_progress → resolved | pending（打回） | accepted
  #   resolved → closed | in_progress（打回） | accepted
  #   closed / accepted → （终态，无出边）
  #
  # `closed` 与 `accepted` 都是终态且不可逆。漏洞复发时**新建一张单**：
  # 允许「闭环后重新打开」会与唯一约束争同一把锁（见下面 active 的说明）。
  /api/remediations:
    get:
      tags: [remediations]
      operationId: listRemediations
      summary: 整改单列表
      description: |
        需要权限 `remediation:read`。

        ## 排序是「工作清单」语义

        按 `(due_date IS NULL) ASC, due_date ASC, id DESC`：
        **期限近的排在最前，没设期限的排在最后**。按 `created_at DESC`
        排会得到一份「最新建的在最上面」的时间线，而整改列表要回答的是
        「我该先动哪个」，时间线回答不了这个问题。

        ## 逾期筛出来的是「当前逾期」

        `overdue=true` 筛 `due_date < 今天 且 未闭环`。
        一张逾期三天之后才闭环的单子，闭环后就不再是逾期的了——
        逾期是当前态，不是历史事实（历史逾期率需要落库才能算，本期不做）。

        ## `active` 与 `status` 同时给时以 `active` 为准

        两者是「集合」与「元素」的关系：未闭环是一个集合，
        同时再指定一个元素，客户端的意图不可能比那个元素更具体。
      security:
        - SessionCookie: []
      parameters:
        - $ref: "#/components/parameters/Page"
        - $ref: "#/components/parameters/PageSize"
        - name: keyword
          in: query
          description: 按标题 / 资产名 / 资产 IP / 漏洞标题 / CVE 号模糊匹配
          schema:
            type: string
        - name: status
          in: query
          description: 按状态精确过滤，不传表示不限
          schema:
            $ref: "#/components/schemas/RemediationStatus"
        - name: active
          in: query
          description: |
            只看未闭环（`pending` / `in_progress` / `resolved`）。
            与 `status` 同时给出时本参数优先。
          schema:
            type: boolean
        - name: overdue
          in: query
          description: 只看已逾期（`due_date < 今天` 且未闭环）
          schema:
            type: boolean
        - name: assignee_id
          in: query
          description: 按整改负责人过滤
          schema:
            type: integer
            format: uint64
        - name: level
          in: query
          description: 按建单时的风险等级过滤
          schema:
            $ref: "#/components/schemas/RiskLevel"
        - name: assessment_id
          in: query
          description: 按发现出处（评估任务）过滤
          schema:
            type: integer
            format: uint64
      responses:
        "200":
          description: 整改单分页
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RemediationPage"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
    post:
      tags: [remediations]
      operationId: createRemediation
      summary: 新建整改单
      description: |
        需要权限 `remediation:write`。审计动作 `remediation.create`。

        ## 必须从风险项建单

        `risk_item_id` 是必填项而不是 `asset_id + vuln_id`。整改单要有
        风险等级与风险值，而这两者只有风险项才有（风险项 = 资产 × 漏洞，
        且带上那次评估算出的 A/T/V/R）。直接给两个 ID 建单看似更灵活，
        代价是造出「等级为空」的单子，而仪表盘的按等级统计与按等级排
        逾期清单都依赖它——一个可以合法为空的字段，迟早会变成一堆
        没人能解释的空格子。

        ## 同一 (资产, 漏洞) 只允许一张未闭环单

        这条约束由数据库的一个**生成列唯一索引**保证，不是应用层查重：
        生成列 `active_key` 在未闭环时等于 `CONCAT(asset_id, ':', vuln_id)`，
        闭环后为 `NULL`；MySQL 的唯一索引把多个 `NULL` 视为互不相同，
        于是「历史上整改过多次」不冲突，而「两张并存的未闭环单」被数据库拒绝。

        ⚠️ 重复建单返回 **409** 而不是幂等成功——单张建单是用户的手工动作，
        拒绝并告知「已有一张未闭环单」比静默返回一张旧单更不容易误解。
        批量建单的语义刻意**不同**（重复则跳过，见 `POST /api/remediations/batch`）。

        ## `title` 留空则取漏洞标题
      security:
        - SessionCookie: []
          CSRFToken: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateRemediationRequest"
      responses:
        "201":
          description: 创建成功
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/OkEnvelope"
                  - type: object
                    required: [data]
                    properties:
                      data:
                        $ref: "#/components/schemas/Remediation"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"

  /api/remediations/batch:
    post:
      tags: [remediations]
      operationId: batchCreateRemediations
      summary: 按评估任务批量建单
      description: |
        需要权限 `remediation:write`。审计动作 `remediation.batch_create`
        （**整批只留一条**，与 `asset.import` 同理：一次点击产生几百条
        `remediation.create` 会把审计页淹掉，而用户真正想查的是
        「谁在什么时候按什么条件建了这批单」）。

        ## 幂等语义刻意与单张建单不同

        已经有未闭环单的目标**跳过、不报错**，结果里的 `skipped` 给出条数。
        理由是典型用法：算完一次评估后把高风险的都开一次单，用户会在
        评估重算后再点一次——那时若因为已有单子而整批失败，这个功能就没法用了。

        ## 两级上限

        `levels` 为空时退化为「很高 + 高」。命中条数超过 500 时整批拒绝
        （`REMEDIATION_BATCH_TOO_LARGE`）并在文案里给出**准确**的命中数
        （先数后取，不是「大概超过 500」）。500 这个数的理由：按「很高 + 高」
        一次几百张已是正常评估的量级，再大就说明漏选了等级筛选；此时
        正确做法是报错让用户收窄条件，而不是替他建出几千张没人会看的单子——
        那会把「逾期数」这个指标彻底废掉。

        `levels` 出现非法等级时**报错而不是静默丢弃**：丢弃会让
        `["very_high", "HIGH"]` 悄悄只建「很高」那批，用户不知道「高」为什么没建。
      security:
        - SessionCookie: []
          CSRFToken: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/BatchCreateRemediationRequest"
      responses:
        "200":
          description: 批量建单结果（含命中 / 新建 / 跳过三个计数）
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/OkEnvelope"
                  - type: object
                    required: [data]
                    properties:
                      data:
                        $ref: "#/components/schemas/BatchCreateRemediationResult"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"

  /api/remediations/{id}:
    get:
      tags: [remediations]
      operationId: getRemediation
      summary: 整改单详情
      description: |
        需要权限 `remediation:read`。返回单子本身 + 完整流转时间线。

        `logs` 里的操作人姓名是**当时的快照**而不是实时查用户表：
        时间线要回答「当时是谁做的」，账号后来改名不该改写历史。
      security:
        - SessionCookie: []
      parameters:
        - $ref: "#/components/parameters/RemediationId"
      responses:
        "200":
          description: 整改单详情
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/OkEnvelope"
                  - type: object
                    required: [data]
                    properties:
                      data:
                        $ref: "#/components/schemas/RemediationDetail"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
    patch:
      tags: [remediations]
      operationId: updateRemediation
      summary: 修改整改单字段
      description: |
        需要权限 `remediation:write`。审计动作 `remediation.update`。

        ## 不含 status

        状态走 `POST /api/remediations/{id}/transition`，两者是不同动作：
        前者改「这张单子长什么样」，后者改「这张单子走到哪一步」。
        混在一起的话，审计里只能看到一个 `update`，
        「改了个期限」与「把单子打回了」再也分不清。

        ## 三态字段

        `assignee_id` 与 `due_date` 都支持三态：

        | 写法 | 含义 |
        | --- | --- |
        | 不传 | 不修改 |
        | `null` | 清空（取消分派 / 去掉期限） |
        | 有值 | 改为该值 |

        用可空类型只能表达两态，「取消分派」与「不修改」在 Go 里都是 `nil`，
        于是清空操作怎么点都不生效，而接口看起来一切正常。

        ⚠️ 已闭环（`closed` / `accepted`）的单子仍可改字段——补一句结论、
        改个错别字是合理需求。**状态**不可逆，字段可以改。
      security:
        - SessionCookie: []
          CSRFToken: []
      parameters:
        - $ref: "#/components/parameters/RemediationId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdateRemediationRequest"
      responses:
        "200":
          description: 修改后的整改单
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/OkEnvelope"
                  - type: object
                    required: [data]
                    properties:
                      data:
                        $ref: "#/components/schemas/Remediation"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
    delete:
      tags: [remediations]
      operationId: deleteRemediation
      summary: 删除整改单
      description: |
        需要权限 `remediation:write`。审计动作 `remediation.delete`。

        ## 只有「待处理」且从未流转过的单子可删

        任一条件不满足返回 **409** `REMEDIATION_DELETE_FORBIDDEN`。
        判据是「有没有 `action='transition'` 的记录」（字段变更不算，
        改个标题不该让单子变得不可删）。

        这条限制的目的是让「有人承诺过要修、后来又改了口」这个事实
        不会被删掉。报错文案里给出替代动作——改成「风险接受」并写明理由，
        而不是只说一句「不允许」。

        删除会 CASCADE 清掉自己的流转记录（`remediation_logs` 只对自己的
        单子有外键），而因为只有零流转记录的单子能删，实际上不会丢历史。
      security:
        - SessionCookie: []
          CSRFToken: []
      parameters:
        - $ref: "#/components/parameters/RemediationId"
      responses:
        "200":
          description: 删除成功（`data` 为 `null`）
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/OkEnvelope"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"

  /api/remediations/{id}/transition:
    post:
      tags: [remediations]
      operationId: transitionRemediation
      summary: 整改单状态流转
      description: |
        需要权限 `remediation:write`。审计动作 `remediation.transition`。

        这是整改跟踪的主干动作，因此单独一个动作码而不是并进 `update`：
        审计页要能直接筛出「谁把单子打回了」。

        ## 合法目标由后端状态机决定

        | 当前 | 可流转到 |
        | --- | --- |
        | `pending` | `in_progress` / `resolved` / `accepted` |
        | `in_progress` | `resolved` / `pending`（打回） / `accepted` |
        | `resolved` | `closed` / `in_progress`（打回） / `accepted` |
        | `closed` | ——（终态） |
        | `accepted` | ——（终态） |

        非法流转返回 **409** `REMEDIATION_TRANSITION_INVALID`，
        文案里列出**该状态实际可选的目标**，而不是只说「不允许」。

        ⚠️ 前端不要自己写一份这张表：详情与列表视图里的 `transitions`
        字段就是这张表的后端投影（含 `note_required` 标记）。
        遍历它渲染按钮，「界面允许但接口拒绝」在结构上就不可能出现。

        ## 三种情况必须写说明

        `→ closed`（怎么修的）、`→ accepted`（为什么不修）、
        `resolved → in_progress`（打回理由）。缺说明返回 400
        `REMEDIATION_NOTE_REQUIRED`。这三处是**唯一**能沉淀「决策理由」的地方：
        闭环时说清怎么修，风险接受时说清为什么不修，
        否则三个月后没人能解释「这张单子为什么就这么关了」。

        ## 流转失败不留痕

        校验在写库之前完成，非法流转**不写**任何 `remediation_logs` 记录：
        失败动作留痕会让时间线上出现一条「试图流转但失败」的记录，
        而用户看到的是一份「看起来发生过」的历史。
      security:
        - SessionCookie: []
          CSRFToken: []
      parameters:
        - $ref: "#/components/parameters/RemediationId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/TransitionRemediationRequest"
      responses:
        "200":
          description: 流转后的整改单
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/OkEnvelope"
                  - type: object
                    required: [data]
                    properties:
                      data:
                        $ref: "#/components/schemas/Remediation"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"

  /api/dashboard/summary:
    get:
      tags: [dashboard]
      operationId: getDashboardSummary
      summary: 首页汇总统计
      description: |
        需要权限 `assessment:read`、`asset:read`、`remediation:read`
        **任一**即可。仪表盘把资产 / 漏洞 / 评估 / 整改四个区块拼在一起，
        要求全部具备会让它对多数内置角色 403。越权风险由「区块内不含敏感字段」
        控制：每个数字都与对应列表页可见的数字同源。

        ## 风险数字必须绑定一个具体评估

        同一句「很高风险有多少条」，在四种口径下会给出四个不同的数字。
        因此所有风险数字都绑定一个具体评估，并在
        `assessments.latest` 里回传它的 ID / 名称 / 计算时间——
        **界面必须显示这三项**，否则那份数字没有意义。

        `assessment_id` 不传时取「最近一次**已计算**的评估」，按
        `calculated_at DESC, id DESC` 排序而**不是 id**：手工补算过的老任务
        会拿到更大的 id，但它不是最新结论。

        ⚠️ 库里一次都没算过是**合法空场景**（刚初始化的系统），
        此时 `assessments.latest` 为 `null`，前端显示空态而不是报错。

        ## 逾期与即将到期的区间不重叠

        逾期 = `due_date < 今天`；即将到期 = `[今天, 今天+7]`（闭区间）。
        **今天到期的算「即将到期」不算「逾期」**——重叠会让同一个单子
        在两个数字里各出现一次，用户会以为有两张单子。

        ## 时间基准只有一个

        「今天」由后端服务层注入并传给仓储，**不用 SQL 的 `CURDATE()`**：
        那会让「今天」有两个来源（Go 进程时区 vs MySQL 会话时区），
        不一致时同一单子在列表页与仪表盘上一个「逾期」一个「不逾期」，
        而两个页面各自都自洽——这是最难排查的一类不一致。
      security:
        - SessionCookie: []
      parameters:
        - name: assessment_id
          in: query
          description: |
            风险数字所依附的评估任务 ID。不传或传 0 表示取最近一次已计算评估。
            显式给出但不存在返回 404；给出的是一份草稿则风险区块按
            「尚未计算」返回全零并带上 `status=draft`。
          schema:
            type: integer
            format: uint64
      responses:
        "200":
          description: 首页汇总
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/OkEnvelope"
                  - type: object
                    required: [data]
                    properties:
                      data:
                        $ref: "#/components/schemas/DashboardSummary"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"

# =============================================================================
components:

  securitySchemes:
    SessionCookie:
      type: apiKey
      in: cookie
      name: sr_at
      description: |
        httpOnly 访问令牌 Cookie。浏览器自动携带，前端无需也无法读取。
        令牌只承载身份（`sub` / `iat` / `iat_ms` / `exp`），不承载权限码；
        权限在每个请求上现查数据库，因此禁用账号与撤销角色即时生效。
    CSRFToken:
      type: apiKey
      in: header
      name: X-CSRF-Token
      description: |
        双提交 CSRF 令牌。其值必须与 `sr_csrf` Cookie 完全一致，
        且请求 `Origin` 须在服务端白名单内。写请求（POST/PATCH/PUT/DELETE）
        必须携带，安全方法（GET/HEAD/OPTIONS）无需携带。

  parameters:
    Page:
      name: page
      in: query
      description: 页码，从 1 开始。越界值自动收敛。
      schema:
        type: integer
        minimum: 1
        default: 1
    PageSize:
      name: pageSize
      in: query
      description: 每页条数，上限 100。越界值自动收敛（避免一次计划外的全表导出）。
      schema:
        type: integer
        minimum: 1
        maximum: 100
        default: 20
    UserId:
      name: id
      in: path
      required: true
      description: 用户 ID
      schema:
        type: integer
        format: uint64
        minimum: 1
    DictionaryId:
      name: id
      in: path
      required: true
      description: 字典项 ID
      schema:
        type: integer
        format: uint64
        minimum: 1
    AssetGroupId:
      name: id
      in: path
      required: true
      description: 资产组 ID
      schema:
        type: integer
        format: uint64
        minimum: 1
    AssetId:
      name: id
      in: path
      required: true
      description: 资产 ID
      schema:
        type: integer
        format: uint64
        minimum: 1
    ScanFileId:
      name: id
      in: path
      required: true
      description: 扫描文件 ID
      schema:
        type: integer
        format: uint64
        minimum: 1
    VulnerabilityId:
      name: id
      in: path
      required: true
      description: 漏洞 ID
      schema:
        type: integer
        format: uint64
        minimum: 1

    AssessmentId:
      name: id
      in: path
      required: true
      description: 评估任务 ID
      schema:
        type: integer
        format: uint64
        minimum: 1
    RiskItemId:
      name: itemId
      in: path
      required: true
      description: 风险项 ID
      schema:
        type: integer
        format: uint64
        minimum: 1

    RemediationId:
      name: id
      in: path
      required: true
      description: 整改单 ID
      schema:
        type: integer
        format: uint64
        minimum: 1

  responses:
    BadRequest:
      description: 参数不合法或请求无法处理（`INVALID_PARAM` / `AUTH_PASSWORD_WEAK` / `AUTH_PASSWORD_MISMATCH` / `AUTH_PASSWORD_UNCHANGED` / `USER_ROLE_NOT_ASSIGNABLE` / `ASSET_TYPE_UNKNOWN` / `ASSET_GROUP_CYCLE` / `ASSET_GROUP_DEPTH_EXCEEDED` / `DICTIONARY_CATEGORY_INVALID` / `DICTIONARY_CODE_IMMUTABLE` / `ASSET_IMPORT_FILE_MISSING` / `ASSET_IMPORT_FILE_TOO_LARGE` / `ASSET_IMPORT_FORMAT_INVALID` / `ASSET_IMPORT_MISSING_COLUMNS` / `ASSET_IMPORT_NO_ROWS` / `ASSET_IMPORT_TOO_MANY_ROWS` / `ASSET_IMPORT_GROUP_NOT_FOUND` / `FILE_TYPE_REJECTED` / `VULN_IMPORT_NO_ROWS` / `VULN_IMPORT_MISSING_COLUMNS` / `VULN_IMPORT_TOO_MANY_ROWS` / `ASSESSMENT_SCOPE_EMPTY` / `ASSESSMENT_EXPORT_TOO_LARGE` / `RISK_CONFIG_INVALID` / `THREAT_NOT_FOUND` / `REMEDIATION_STATUS_INVALID` / `REMEDIATION_NOTE_REQUIRED` / `REMEDIATION_BATCH_TOO_LARGE`）
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorEnvelope"
    Unauthorized:
      description: 未认证或登录状态失效（`UNAUTHORIZED` / `AUTH_TOKEN_EXPIRED` / `AUTH_TOKEN_INVALID` / `AUTH_INVALID_CREDENTIALS`）
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorEnvelope"
    Forbidden:
      description: 已认证但无权限，或请求被安全中间件拦下（`FORBIDDEN` / `AUTH_ACCOUNT_DISABLED` / `AUTH_CSRF_INVALID` / `AUTH_MUST_CHANGE_PASSWORD`）
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorEnvelope"
    NotFound:
      description: 资源不存在（`NOT_FOUND` / `ASSET_NOT_FOUND` / `ASSET_GROUP_NOT_FOUND` / `DICTIONARY_NOT_FOUND` / `FILE_NOT_FOUND` / `VULN_NOT_FOUND` / `ASSESSMENT_NOT_FOUND` / `RISK_ITEM_NOT_FOUND` / `REMEDIATION_NOT_FOUND`）
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorEnvelope"
    Conflict:
      description: 与现有状态冲突（`USER_USERNAME_TAKEN` / `USER_EMAIL_TAKEN` / `USER_LAST_ADMIN` / `USER_SELF_OPERATION` / `ASSET_NO_TAKEN` / `ASSET_GROUP_NAME_TAKEN` / `ASSET_GROUP_HAS_CHILDREN` / `ASSET_GROUP_HAS_ASSETS` / `DICTIONARY_CODE_TAKEN` / `DICTIONARY_BUILTIN_READONLY` / `DICTIONARY_IN_USE` / `FILE_ALREADY_PARSED` / `FILE_IN_USE` / `REPORT_NOT_CALCULATED` / `REMEDIATION_DUPLICATE_ACTIVE` / `REMEDIATION_TRANSITION_INVALID` / `REMEDIATION_DELETE_FORBIDDEN` / `REMEDIATION_BATCH_EMPTY`）
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorEnvelope"
    # 带结构化明细的错误：目前只有批量导入用。
    # 单独定义一个响应而不是给 Conflict 加上 data，是为了不让绝大多数接口的
    # 响应形状因为一个特例而变宽——前端可以据此把「要读 data」和「不读 data」
    # 在类型上区分开。
    ConflictWithImportDetail:
      description: |
        导入的文件里存在不合格的行，**一条都没有写入**（`ASSET_IMPORT_HAS_ERRORS`）。
        响应体是 `ErrorDetailEnvelope`，`data` 里带完整的预览结果
        （含全部行级错误），前端可以直接渲染出与预览阶段一样的错误表。
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorDetailEnvelope"
    Locked:
      description: 账号被临时锁定（`AUTH_ACCOUNT_LOCKED`）
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorEnvelope"
    TooManyRequests:
      description: 触发限流（`TOO_MANY_REQUESTS`）。响应含 `Retry-After` 头（秒）。
      headers:
        Retry-After:
          description: 建议的重试等待秒数
          schema:
            type: integer
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorEnvelope"
    RequestEntityTooLarge:
      description: 上传文件超过体积上限（`FILE_TOO_LARGE`，单文件 10 MB）
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorEnvelope"
    ServiceUnavailable:
      description: |
        报告渲染上游暂时不可用（`REPORT_RENDER_FAILED`）。

        报告渲染要起两个外部进程：docgen（.NET，生成 docx）与 Gotenberg
        （Chromium，生成 pdf）。任一不可用——容器没起来、正在重启、超时、
        返回 5xx——都会走到这个响应。

        ⚠️ 刻意是 **503 而不是 500**：503 对用户意味着「服务在，只是这一刻
        不行，稍后重试大概率就好了」，而 500 意味着「系统自己有毛病」。
        把这条路径笼统归成 500，会让「再点一次导出」这个正确动作被劝退。

        注意：**Excel 导出不会返回这个码**。它由 excelize 在进程内生成，
        不依赖任何上游，因此上游全挂时它照常可用。
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorEnvelope"
    UnsupportedMediaType:
      description: 无法识别的报告格式（`FILE_FORMAT_UNKNOWN`），支持 Nessus XML / OpenVAS XML / 通用表格
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorEnvelope"

  schemas:

    # ---------------------------------------------------------- 信封与通用

    OkEnvelope:
      type: object
      title: 成功信封
      description: 所有业务成功响应的外层结构，`data` 的具体形状由各接口决定。
      required: [code, message]
      properties:
        code:
          type: string
          enum: [OK]
          description: 成功时固定为 `OK`
        message:
          type: string
          description: 面向人的提示文案，可随时改写，**不要**用它做程序判断
        request_id:
          type: string
          description: 请求追踪 ID，与访问日志、审计日志中的同名字段可串联

    ErrorEnvelope:
      type: object
      title: 错误信封
      description: 业务失败响应的外层结构，不含 `data`。
      required: [code, message]
      properties:
        code:
          $ref: "#/components/schemas/ErrorCode"
        message:
          type: string
          description: 面向人的提示文案。服务端绝不回显底层错误（会泄漏 SQL 片段与表结构）。
        request_id:
          type: string
          description: 请求追踪 ID。报障时提供它即可定位到完整日志。

    ErrorCode:
      type: string
      title: 业务错误码
      description: |
        错误码是前后端契约的一部分：前端依据它决定「弹提示」「跳登录」
        「静默刷新后重试」还是「展示锁定倒计时」，而不是去匹配 `message` 文案。
        因此 `message` 可改，`code` 一经发布不得变更。

        ⚠️ 这个枚举与后端注册表 `internal/pkg/errcode` 的 `allCodes` 必须**完全一致**。
        由 `TestErrorCodeEnumCoversRegistry` 双向核对：漏登记 → 前端不知道有这个码；
        多登记 → 契约里出现永远拿不到的幽灵码，两种方向都会让测试变红。
      enum:
        - INVALID_PARAM
        - UNAUTHORIZED
        - FORBIDDEN
        - NOT_FOUND
        - CONFLICT
        - TOO_MANY_REQUESTS
        - INTERNAL_ERROR
        - AUTH_INVALID_CREDENTIALS
        - AUTH_ACCOUNT_LOCKED
        - AUTH_ACCOUNT_DISABLED
        - AUTH_TOKEN_EXPIRED
        - AUTH_TOKEN_INVALID
        - AUTH_CSRF_INVALID
        - AUTH_PASSWORD_WEAK
        - AUTH_PASSWORD_MISMATCH
        - AUTH_MUST_CHANGE_PASSWORD
        - AUTH_PASSWORD_UNCHANGED
        - USER_USERNAME_TAKEN
        - USER_EMAIL_TAKEN
        - USER_LAST_ADMIN
        - USER_SELF_OPERATION
        - USER_ROLE_NOT_ASSIGNABLE
        - ASSET_NOT_FOUND
        - ASSET_NO_TAKEN
        - ASSET_TYPE_UNKNOWN
        - ASSET_GROUP_NOT_FOUND
        - ASSET_GROUP_NAME_TAKEN
        - ASSET_GROUP_HAS_CHILDREN
        - ASSET_GROUP_HAS_ASSETS
        - ASSET_GROUP_CYCLE
        - ASSET_GROUP_DEPTH_EXCEEDED
        - ASSET_IMPORT_FILE_MISSING
        - ASSET_IMPORT_FILE_TOO_LARGE
        - ASSET_IMPORT_FORMAT_INVALID
        - ASSET_IMPORT_MISSING_COLUMNS
        - ASSET_IMPORT_NO_ROWS
        - ASSET_IMPORT_TOO_MANY_ROWS
        - ASSET_IMPORT_HAS_ERRORS
        - ASSET_IMPORT_GROUP_NOT_FOUND
        - DICTIONARY_NOT_FOUND
        - DICTIONARY_CATEGORY_INVALID
        - DICTIONARY_CODE_TAKEN
        - DICTIONARY_CODE_IMMUTABLE
        - DICTIONARY_BUILTIN_READONLY
        - DICTIONARY_IN_USE
        - FILE_NOT_FOUND
        - FILE_TYPE_REJECTED
        - FILE_TOO_LARGE
        - FILE_ALREADY_PARSED
        - FILE_IN_USE
        - FILE_FORMAT_UNKNOWN
        - VULN_NOT_FOUND
        - VULN_HAS_ERRORS
        - VULN_IMPORT_NO_ROWS
        - VULN_IMPORT_MISSING_COLUMNS
        - VULN_IMPORT_TOO_MANY_ROWS
        - ASSESSMENT_NOT_FOUND
        - ASSESSMENT_SCOPE_EMPTY
        - ASSESSMENT_EXPORT_TOO_LARGE
        - RISK_ITEM_NOT_FOUND
        - RISK_CONFIG_INVALID
        - RISK_CONFIG_READONLY
        - THREAT_NOT_FOUND
        - REPORT_NOT_CALCULATED
        - REPORT_RENDER_FAILED
        - REMEDIATION_NOT_FOUND
        - REMEDIATION_DUPLICATE_ACTIVE
        - REMEDIATION_STATUS_INVALID
        - REMEDIATION_TRANSITION_INVALID
        - REMEDIATION_NOTE_REQUIRED
        - REMEDIATION_DELETE_FORBIDDEN
        - REMEDIATION_BATCH_TOO_LARGE
        - REMEDIATION_BATCH_EMPTY

    ErrorDetailEnvelope:
      type: object
      title: 带结构化明细的错误信封
      description: |
        极少数错误需要把结构化明细一并返回，典型场景是批量导入：错误响应必须
        带「第几行、哪一列、什么值、为什么不合法」，前端才能渲染出一张可定位
        的错误表。把这些塞进 `message` 会变成一段没法解析的散文。

        与 `ErrorEnvelope` 分开定义而不是加一个可选 `data`：单开一个形状，
        前端才能把「要读 data」与「不读 data」在**类型上**区分开，
        不会出现「看着有个 data 字段，其实是 undefined」。
      required: [code, message, data]
      properties:
        code:
          type: string
          enum: [ASSET_IMPORT_HAS_ERRORS, VULN_HAS_ERRORS]
          description: 目前只有这两个错误码会用到本信封
        message:
          type: string
          description: 面向人的提示文案
        data:
          description: 完整的预览结果，形状与对应 preview 接口的 `data` 完全一致
          oneOf:
            - $ref: "#/components/schemas/AssetImportPreview"
              description: "`ASSET_IMPORT_HAS_ERRORS` 时的形状"
            - $ref: "#/components/schemas/VulnParsePreview"
              description: "`VULN_HAS_ERRORS` 时的形状（Excel 报告解析行级报错）"
        request_id:
          type: string
          description: 请求追踪 ID

    # ---------------------------------------------------------- 文件与漏洞解析（P3）

    ScanParseStatus:
      type: string
      title: 解析状态
      description: |
        文件在解析流水线里的位置。`unparsed`（已上传未解析）→
        `parsed`（漏洞已入库）或 `failed`（解析失败，失败原因看服务端日志）。
      enum: [unparsed, parsed, failed]

    ScanFile:
      type: object
      title: 扫描文件
      required: [id, original_name, sha256, size_bytes, mime_type, format, parse_status, vuln_count, uploaded_name, created_at]
      properties:
        id:
          type: integer
          format: uint64
        original_name:
          type: string
          description: 上传时的原始文件名
        sha256:
          type: string
          description: 内容指纹。同一内容的文件在系统里永远只有一份（重复上传返回已有记录）
        size_bytes:
          type: integer
        mime_type:
          type: string
          description: 客户端声明的内容类型。仅作参考，服务端按魔数判型
        format:
          type: string
          title: 报告格式
          description: |
            上传时按内容嗅探的格式。空串表示「没认出来」——注意与
            `parse_status: failed` 区分：空 format 是「不知道是什么」，
            failed 是「认出来了但解析过程出错」。
          enum: [nessus, openvas, excel, ""]
        parse_status:
          $ref: "#/components/schemas/ScanParseStatus"
        parsed_at:
          type: [string, "null"]
          format: date-time
          description: 解析完成时间。未解析时为 `null`
        vuln_count:
          type: integer
          description: 该文件解析出的漏洞条数。未解析时恒为 0
        uploaded_by:
          type: [integer, "null"]
          format: uint64
          description: 上传人用户 ID。系统内部操作时为 `null`
        uploaded_name:
          type: string
          description: 上传人显示名。已被删除的用户显示为「已删除用户」
        created_at:
          type: string
          format: date-time

    ScanFilePage:
      type: object
      title: 扫描文件分页
      required: [items, total]
      properties:
        items:
          type: array
          items:
            $ref: "#/components/schemas/ScanFile"
        total:
          type: integer

    UploadScanFileResult:
      type: object
      title: 上传结果
      required: [file, duplicate]
      properties:
        file:
          $ref: "#/components/schemas/ScanFile"
        duplicate:
          type: boolean
          description: |
            同一内容（SHA-256 相同）重复上传时为 `true`，此时 `file`
            是**已有记录**——新文件不会落盘，调用方拿到 id 后照常进入
            解析预览，不需要特殊处理。

    ParseRequest:
      type: object
      title: 解析请求
      description: preview 与 commit 共用同一个请求形状；两者都按 file_id 重新解析，服务端不缓存预览结果。
      required: [file_id]
      properties:
        file_id:
          type: integer
          format: uint64

    ParseRowError:
      type: object
      title: 解析行级错误
      description: 与资产导入的 `ImportRowError` 同构：定位到「第几行、哪一列、什么值、为什么不合法」。
      required: [row, column, value, message]
      properties:
        row:
          type: integer
          description: 源文件行号（含表头，与 Excel 里看到的行号一致）
        column:
          type: string
          description: 列名
        value:
          type: string
          description: 原始值
        message:
          type: string
          description: 不合法的原因

    VulnParsePreview:
      type: object
      title: 漏洞解析预览
      description: |
        `POST /api/parser/preview` 的结果。只读：不改 `parse_status`、
        不写漏洞、不产生审计。同一个文件可以反复预览（比如先补了几条
        资产再看匹配情况）。**预览结果不被 commit 复用**——commit 会
        重新解析重新校验，因为服务端不持有会话状态，预览后台账可能已变。
      required: [file_id, file_name, format, total, unmatched_ips, matched_count, error_rows, errors, missing_columns]
      properties:
        file_id:
          type: integer
          format: uint64
        file_name:
          type: string
        format:
          type: string
          description: 本次解析实际认领的格式（按魔数与根元素判定，不信扩展名）
          enum: [nessus, openvas, excel]
        total:
          type: integer
          description: 解析出的漏洞条数
        unmatched_ips:
          type: array
          description: |
            解析出、但资产台账里没有对应资产的主机 IP（去重后按字典序）。
            **仅供参考，不阻塞 commit**——「先传报告、后补资产」是正常
            顺序，未命中的漏洞入库后保持「未关联」，可随时手动补挂。
          items:
            type: string
        matched_count:
          type: integer
          description: 至少匹配到一台资产的漏洞条数（按 host_ip 精确匹配）
        error_rows:
          type: integer
          description: 不合格的行数（Excel 路径）。**这是真实总数**，可能大于 `errors` 的长度
        errors:
          type: array
          items:
            $ref: "#/components/schemas/ParseRowError"
          description: 最多 200 条，超出的部分只计数不列出
        missing_columns:
          type: array
          description: 缺失的必需列。**非空时其它字段无意义**，commit 会以 `VULN_HAS_ERRORS` 失败
          items:
            type: string

    VulnParseResult:
      type: object
      title: 漏洞解析入库结果
      description: "`POST /api/parser/commit` 的结果。原子性：任一行不合格则一条不写。"
      required: [file_id, imported, linked_auto, unmatched_ips]
      properties:
        file_id:
          type: integer
          format: uint64
        imported:
          type: integer
          description: 实际入库的漏洞条数
        linked_auto:
          type: integer
          description: 按 host_ip 自动挂上资产的漏洞条数
        unmatched_ips:
          type: integer
          description: 没有匹配到任何资产的不同 IP 个数（这些漏洞保持「未关联」）

    VulnAsset:
      type: object
      title: 漏洞关联资产
      required: [asset_id, asset_name, asset_ip, matched_by]
      properties:
        asset_id:
          type: integer
          format: uint64
        asset_name:
          type: string
        asset_ip:
          type: string
        matched_by:
          type: string
          title: 关联方式
          description: |
            `auto` = commit 时按 IP 精确匹配建立；`manual` = 人工挂接。
            手动关联接口是**整体替换**语义且只影响 `manual` 链接——
            手动操作无权覆盖解析结果，自动链接只能随文件删除一起消失。
          enum: [auto, manual]

    Vulnerability:
      type: object
      title: 漏洞
      required: [id, source_file_id, source_file_name, title, cve_ids, severity_raw, severity, description, solution, host_ip, port, protocol, service, linked_count, created_at, updated_at]
      properties:
        id:
          type: integer
          format: uint64
        source_file_id:
          type: [integer, "null"]
          format: uint64
          description: |
            来源扫描文件 ID。`null` 表示手工录入。删除来源文件会
            级联删除其解析出的漏洞（有 `source_file_id` 的记录都指向它）。
        source_file_name:
          type: string
          description: 来源文件名（冗余展示用）。手工录入为空串
        title:
          type: string
          maxLength: 512
        cve_ids:
          type: string
          description: |
            关联的 CVE 编号，逗号分隔（如 `CVE-2021-44228,CVE-2021-45046`）。
            已按规范大写并去重。刻意不建子表——CVE 列表是展示与跳转用
            的弱关系，不是需要引用完整性的强关系。
        severity_raw:
          type: string
          description: |
            扫描器的原始严重程度串，**保留下来是为了与 `severity` 对照**：
            数值列用于筛选统计，这一列用于回答「5 级这个判断是扫描器给的还是
            我们算出来的」。

            具体存什么取决于**定级依据**：Nessus 报告里若带 `cvss_base_score`，
            存的是那个分值（如 `8.1`），因为 CVSS 是客观数值、优先于等级属性；
            没有 CVSS 时存等级词（如 `HIGH`）。通用表格则原样保留「严重程度」
            列里写的内容（`高危` / `3.7` / `中` 都可能）。手工录入时可为空。
        severity:
          type: integer
          title: 严重程度（标准五级）
          description: |
            统一换算后的 1–5：5=严重 4=高危 3=中危 2=低危 1=信息。
            换算规则：CVSS 分值优先（≥9→5 / ≥7→4 / ≥4→3 / >0→2 / 0→1），
            无 CVSS 时按原始等级词映射（Critical→5 / High→4 / Medium→3 /
            Low→2 / Info→1）。列表筛选、统计都只看这个字段。
          minimum: 1
          maximum: 5
        description:
          type: [string, "null"]
          description: 漏洞描述
        solution:
          type: [string, "null"]
          description: 修复建议
        host_ip:
          type: string
          description: 受影响主机 IP。多端口多条目是扫描器的常见输出形态，每条一个 IP
        port:
          type: [integer, "null"]
          description: 受影响端口。`null` 表示与端口无关（系统级/通用漏洞）。0 不是合法端口，解析时会被清空
        protocol:
          type: string
          description: 协议（tcp/udp 等，小写）。可为空
        service:
          type: string
          description: 服务名（https/general 等）。可为空
        linked_count:
          type: integer
          description: 已关联资产数（含 auto 与 manual）
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time

    VulnerabilityDetail:
      type: object
      title: 漏洞详情（含关联资产）
      required: [vulnerability, assets]
      properties:
        vulnerability:
          $ref: "#/components/schemas/Vulnerability"
        assets:
          type: array
          description: 关联的全部资产（auto + manual，manual 排在前面）
          items:
            $ref: "#/components/schemas/VulnAsset"

    VulnPage:
      type: object
      title: 漏洞分页
      required: [items, total]
      properties:
        items:
          type: array
          items:
            $ref: "#/components/schemas/Vulnerability"
        total:
          type: integer

    CreateVulnerabilityRequest:
      type: object
      title: 手工录入漏洞
      description: |
        只有 `title` 必填——扫描报告之外评估人员自己发现的漏洞，往往
        一开始只有一个名字。`severity` 与 `severity_raw` 至少给一个：
        只给等级词（如「高」）时按词映射，两者都给时以数值为准。
      required: [title]
      properties:
        title:
          type: string
          maxLength: 512
        cve_ids:
          type: array
          description: 会做规范化（大写、去重）后以逗号拼接存储
          items:
            type: string
        severity:
          type: integer
          minimum: 1
          maximum: 5
        severity_raw:
          type: string
          description: 原始等级词（如 High / 高），仅在未提供 `severity` 时参与映射
        description:
          type: string
        solution:
          type: string
        host_ip:
          type: string
        port:
          type: [integer, "null"]
          description: 0 视为「与端口无关」，存 `null`
        protocol:
          type: string
        service:
          type: string

    UpdateVulnerabilityRequest:
      type: object
      title: 编辑漏洞
      description: |
        全部字段可选。`port` 是**三态**的（不传 = 不修改，`null` = 清空，
        给值 = 设值），与资产编辑同规则；其余字符串字段是两态
        （不传 = 不修改，空串 = 清空）。

        来源文件解析出的漏洞同样允许编辑——扫描器的结论只是输入，
        评估人员的修正是分析的一部分，审计里留有痕迹。
      properties:
        title:
          type: string
          maxLength: 512
        cve_ids:
          type: array
          items:
            type: string
        severity:
          type: integer
          minimum: 1
          maximum: 5
        description:
          type: [string, "null"]
          description: 不传 = 不修改；`null` = 清空；给值 = 设值
        solution:
          type: [string, "null"]
          description: 不传 = 不修改；`null` = 清空；给值 = 设值
        host_ip:
          type: string
        port:
          type: [integer, "null"]
          description: 三态：不传 = 不修改；`null` 或 0 = 清空；给值 = 设值
        protocol:
          type: string
        service:
          type: string

    SetVulnAssetsRequest:
      type: object
      title: 设置漏洞关联资产
      description: |
        **整体替换语义**：`asset_ids` 就是该漏洞的 `manual` 关联最终状态，
        传空数组 = 清空全部手动关联。所有 ID 必须存在、去重、不超过 100 个。
        只影响 `matched_by = manual` 的链接，自动关联不受影响。
      required: [asset_ids]
      properties:
        asset_ids:
          type: array
          maxItems: 100
          items:
            type: integer
            format: uint64

    # ---------------------------------------------------------- 运维探针

    HealthLive:
      type: object
      title: 存活探针响应
      required: [status, service, version, time]
      properties:
        status:
          type: string
          enum: [ok]
        service:
          type: string
        version:
          type: string
        time:
          type: string
          format: date-time

    HealthReady:
      type: object
      title: 就绪探针响应
      required: [status, service, checks]
      properties:
        status:
          type: string
          enum: [ok, degraded]
          description: 任一下游依赖不可用时为 `degraded`（HTTP 状态码同时为 503）
        service:
          type: string
        version:
          type: string
        env:
          type: string
          enum: [dev, test, prod]
        commit:
          type: string
        checks:
          type: object
          description: 各依赖的检查结果。key 为依赖名，当前仅 `database`。
          additionalProperties:
            type: object
            required: [status]
            properties:
              status:
                type: string
                enum: [ok, error]
              detail:
                type: string
                description: 人类可读的补充说明（连接池统计、错误原因）
        time:
          type: string
          format: date-time

    VersionInfo:
      type: object
      title: 构建版本信息
      required: [service, version]
      properties:
        service:
          type: string
        version:
          type: string
        commit:
          type: string
        build_time:
          type: string
        env:
          type: string

    # ---------------------------------------------------------- 认证

    CsrfToken:
      type: object
      title: CSRF 令牌
      required: [csrf_token, header_name]
      properties:
        csrf_token:
          type: string
          description: 双提交令牌。须原样回填到 `header_name` 指定的请求头。
        header_name:
          type: string
          enum: [X-CSRF-Token]
          description: 该令牌应放入的请求头名称。由服务端下发而非前端硬编码，
           是为了让「改头名」这件事只在一个地方发生。

    LoginRequest:
      type: object
      title: 登录请求
      required: [username, password]
      properties:
        username:
          type: string
          minLength: 1
          maxLength: 64
        password:
          type: string
          minLength: 1
          maxLength: 128
          description: 明文密码。仅在本请求体内出现，绝不落库、绝不写日志。

    SessionUser:
      type: object
      title: 会话内的用户信息
      required: [user_id, username, roles, permissions]
      properties:
        user_id:
          type: integer
          format: uint64
        username:
          type: string
        display_name:
          type: string
        roles:
          type: array
          items:
            type: string
          description: 角色码列表，如 `["admin"]`
        permissions:
          type: array
          items:
            $ref: "#/components/schemas/PermissionCode"
          description: 当前生效的权限码全集（已去重、已稳定排序）

    Session:
      type: object
      title: 会话载荷
      description: |
        登录与刷新返回同一结构。响应同时通过 `Set-Cookie` 下发三枚 Cookie，
        因此前端**不需要**从这个结构里取令牌——这里回显是为了让非浏览器客户端
        （脚本、集成测试）也能用同一份契约。
      required: [user, expires_in, must_change_password, csrf_token]
      properties:
        user:
          $ref: "#/components/schemas/SessionUser"
        expires_in:
          type: integer
          description: 访问令牌剩余有效秒数
          example: 900
        must_change_password:
          type: boolean
          description: 为 `true` 时前端应强制跳转改密页，否则业务接口一律返回 403
        csrf_token:
          type: string
          description: 本轮会话的 CSRF 令牌（与 `sr_csrf` Cookie 一致）

    Me:
      type: object
      title: 当前登录者
      required: [user_id, username, roles, permissions, must_change_password]
      properties:
        user_id:
          type: integer
          format: uint64
        username:
          type: string
        display_name:
          type: string
        email:
          type: string
          description: 未填写时为空串
        roles:
          type: array
          items:
            $ref: "#/components/schemas/RoleBrief"
        permissions:
          type: array
          items:
            $ref: "#/components/schemas/PermissionCode"
        must_change_password:
          type: boolean
        last_login_at:
          type: [string, "null"]
          format: date-time
        last_login_ip:
          type: string

    PermissionCode:
      type: string
      title: 权限码
      description: 形如 `<资源>:<动作>`，仅 `read` / `write` 两档。
      enum:
        - user:read
        - user:write
        - role:read
        - role:write
        - asset:read
        - asset:write
        - dictionary:read
        - dictionary:write
        - file:read
        - file:write
        - vulnerability:read
        - vulnerability:write
        - assessment:read
        - assessment:write
        - remediation:read
        - remediation:write
        - report:read
        - report:write
        - audit:read
        - system:read
        - system:write

    ChangePasswordRequest:
      type: object
      title: 修改密码请求
      required: [old_password, new_password]
      properties:
        old_password:
          type: string
          minLength: 1
          maxLength: 128
        new_password:
          type: string
          minLength: 8
          maxLength: 128
          description: 长度按 Unicode 字符计（不是字节），8–128 之间。

    ChangedPayload:
      type: object
      required: [changed]
      properties:
        changed:
          type: boolean
          enum: [true]

    LoggedOutPayload:
      type: object
      required: [logged_out]
      properties:
        logged_out:
          type: boolean
          enum: [true]

    ResetPayload:
      type: object
      required: [reset]
      properties:
        reset:
          type: boolean
          enum: [true]

    UnlockedPayload:
      type: object
      required: [unlocked]
      properties:
        unlocked:
          type: boolean
          enum: [true]

    # ---------------------------------------------------------- 用户

    UserStatus:
      type: string
      title: 账号状态
      enum: [active, disabled]
      description: |
        - `active`：可登录
        - `disabled`：不可登录；已签发的访问令牌在下次请求时即被拒绝

    RoleBrief:
      type: object
      title: 角色摘要
      required: [id, code, name]
      properties:
        id:
          type: integer
          format: uint64
        code:
          type: string
        name:
          type: string

    Role:
      type: object
      title: 角色
      required: [id, code, name, description, is_builtin]
      properties:
        id:
          type: integer
          format: uint64
        code:
          type: string
          description: 角色码，分配给用户时使用它而非 id
        name:
          type: string
        description:
          type: string
        is_builtin:
          type: boolean
          description: 内置角色（admin / assessor / auditor），不可删除

    RoleList:
      type: object
      title: 角色字典
      required: [items]
      properties:
        items:
          type: array
          items:
            $ref: "#/components/schemas/Role"

    UserDetail:
      type: object
      title: 用户详情
      required: [id, username, display_name, email, status, roles, must_change_password, created_at, updated_at]
      properties:
        id:
          type: integer
          format: uint64
        username:
          type: string
          description: 登录名，创建后不可修改
        display_name:
          type: string
        email:
          type: string
          description: 未填写时为空串（库中存 NULL，避免唯一索引下空串互相冲突）
        status:
          $ref: "#/components/schemas/UserStatus"
        roles:
          type: array
          items:
            $ref: "#/components/schemas/RoleBrief"
        must_change_password:
          type: boolean
        locked_until:
          type: [string, "null"]
          format: date-time
          description: 锁定到期时间；未锁定为 `null`
        last_login_at:
          type: [string, "null"]
          format: date-time
        last_login_ip:
          type: string
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time

    UserPage:
      type: object
      title: 用户分页结果
      required: [items, total, page, page_size]
      properties:
        items:
          type: array
          items:
            $ref: "#/components/schemas/UserDetail"
        total:
          type: integer
          format: int64
        page:
          type: integer
        page_size:
          type: integer

    CreateUserRequest:
      type: object
      title: 新建用户请求
      required: [username, password]
      properties:
        username:
          type: string
          minLength: 3
          maxLength: 32
          pattern: "^[A-Za-z0-9][A-Za-z0-9_.-]{2,31}$"
          description: 3–32 位，字母或数字开头，可含 `_` `.` `-`。收紧字符集可避免
            空白与控制字符污染日志。
        display_name:
          type: string
          maxLength: 32
          description: 留空时回落为登录名
        email:
          type: string
          format: email
          description: 可留空；填写时须全局唯一
        password:
          type: string
          minLength: 8
          maxLength: 128
        roles:
          type: array
          items:
            type: string
          description: 角色码列表。留空表示暂不分配角色。

    UpdateUserRequest:
      type: object
      title: 编辑用户请求
      description: 所有字段可选。`null` 与「不传」语义不同，见接口说明。
      properties:
        display_name:
          type: [string, "null"]
          maxLength: 32
        email:
          type: [string, "null"]
          format: email
        status:
          oneOf:
            - $ref: "#/components/schemas/UserStatus"
            - type: "null"
        roles:
          type: [array, "null"]
          items:
            type: string

    ResetPasswordRequest:
      type: object
      title: 重置密码请求
      required: [new_password]
      properties:
        new_password:
          type: string
          minLength: 8
          maxLength: 128

    # ---------------------------------------------------------- 审计

    AuditLog:
      type: object
      title: 审计记录
      required: [id, username, action, resource, method, path, status_code, client_ip, created_at]
      properties:
        id:
          type: integer
          format: uint64
        user_id:
          type: [integer, "null"]
          format: uint64
          description: 操作人 ID；匿名操作（如登录失败）为 `null`
        username:
          type: string
          description: 冗余存储的操作人登录名。账号改名后历史日志仍能对应到人，
           因此审计表刻意不对 `users` 建外键。
        action:
          type: string
          description: 动作码，见接口说明中的取值列表
        resource:
          type: string
          description: 资源类型，如 `user`
        resource_id:
          type: string
          description: 资源标识
        method:
          type: string
        path:
          type: string
        status_code:
          type: integer
        client_ip:
          type: string
          description: 来源 IP。仅在显式配置了可信代理时才会采用 `X-Forwarded-For`，
           否则取直连地址——否则该字段可被客户端伪造，既污染审计又会绕过限流。
        user_agent:
          type: string
        detail:
          description: |
            变更明细（任意 JSON 对象）或 `null`。写入前已递归剔除
            密码、令牌等敏感字段，因此即便某个 handler 把整个请求体塞进来，
            明文口令也不会落进审计日志。
        request_id:
          type: string
        created_at:
          type: string
          format: date-time

    AuditLogPage:
      type: object
      title: 审计日志分页结果
      required: [items, total, page, page_size]
      properties:
        items:
          type: array
          items:
            $ref: "#/components/schemas/AuditLog"
        total:
          type: integer
          format: int64
        page:
          type: integer
        page_size:
          type: integer

    # ---------------------------------------------------------- 业务字典

    DictionaryCategory:
      type: string
      title: 字典类别
      description: |
        四类的 `weight` 语义**并不相同**，这一点必须在契约里说清：

        | 类别 | 含义 | `weight` 语义 |
        | --- | --- | --- |
        | `asset_type` | 资产类型 | 不参与风险计算，**恒为 1** |
        | `threat` | 威胁 | 发生可能性 T（1–5） |
        | `vulnerability` | 脆弱性 | 严重程度 V（1–5） |
        | `measure` | 已有措施 | 防护有效性（1–5，越大越好） |

        四类共用一张表与一个 `weight` 列：除权重外的结构与增删改查行为完全
        一致，合成一张表让字典维护页只需要一套 CRUD。代价是这一列承载了四种
        语义，因此必须靠这份说明交代清楚。
      enum: [asset_type, threat, vulnerability, measure]

    Dictionary:
      type: object
      title: 字典项
      required: [id, category, code, name, weight, is_builtin, enabled, sort_order]
      properties:
        id:
          type: integer
          format: uint64
        category:
          $ref: "#/components/schemas/DictionaryCategory"
        code:
          type: string
          description: |
            字典码，`^[a-z][a-z0-9_]{0,63}$`，**创建后不可修改**。
            资产表按码引用字典（`assets.asset_type` 存的就是它），
            因此历史资产不会因为字典行被重排而指向别的类型，
            资产表也能脱离字典表被单独读懂。
        name:
          type: string
          description: 显示名称（可改，可重复）
        weight:
          type: number
          format: double
          minimum: 1
          maximum: 5
          description: 语义由 `category` 决定，见 `DictionaryCategory`
        description:
          type: string
        is_builtin:
          type: boolean
          description: 内置项（由迁移脚本种子写入）。内置项**可以停用但不可以删除**。
        enabled:
          type: boolean
          description: |
            `false` 表示停用：不再出现在新建表单里，但历史数据引用它时**仍能
            翻译出中文名**——这正是「停用」优于「删除」的地方。
        sort_order:
          type: integer
          description: 下拉框内的自定义顺序；相同则按内置优先、再按 id
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time

    DictionaryList:
      type: object
      title: 字典项列表
      required: [items]
      properties:
        items:
          type: array
          items:
            $ref: "#/components/schemas/Dictionary"

    CreateDictionaryRequest:
      type: object
      title: 新建字典项
      required: [category, code, name]
      properties:
        category:
          $ref: "#/components/schemas/DictionaryCategory"
        code:
          type: string
          pattern: "^[a-z][a-z0-9_]{0,63}$"
        name:
          type: string
          maxLength: 64
        weight:
          type: number
          format: double
          minimum: 1
          maximum: 5
          description: 省略时按类别取默认值（`asset_type` 恒为 1，其余为 3）
        description:
          type: string
          maxLength: 255
        sort_order:
          type: integer

    UpdateDictionaryRequest:
      type: object
      title: 编辑字典项
      description: 全部字段可选，未出现的字段不修改。
      properties:
        code:
          type: string
          description: 只能等于原值。传了别的值返回 `DICTIONARY_CODE_IMMUTABLE`（400），而非静默忽略。
        name:
          type: string
          maxLength: 64
        weight:
          type: number
          format: double
          minimum: 1
          maximum: 5
        description:
          type: string
          maxLength: 255
        enabled:
          type: boolean
          description: 内置项的正确停用方式（停用不破坏任何引用）
        sort_order:
          type: integer

    # ---------------------------------------------------------- 资产分组

    AssetGroup:
      type: object
      title: 资产组（树节点）
      required: [id, name, path, depth, asset_count, total_asset_count, children]
      properties:
        id:
          type: integer
          format: uint64
        parent_id:
          type: [integer, "null"]
          format: uint64
          description: 父组 ID；根组为 `null`
        name:
          type: string
        path:
          type: string
          description: |
            数据库里的**物化路径**，形如 `/1/4/9/`（末尾带斜杠、包含自身）。
            对外暴露是为了让运维能对照数据库排查，**前端不应基于它做业务判断**。

            末尾那个斜杠不是装饰：它让 `"/1/4/"` 不再是 `"/1/41/"` 的前缀，
            因此「A 是不是 B 的祖先」这个判断不会在 ID 位数变化时出错。
        depth:
          type: integer
          description: 层级，根组为 0，上限 7（共 8 层）
        description:
          type: string
        sort_order:
          type: integer
        asset_count:
          type: integer
          format: int64
          description: "**直属**该组的资产数"
        total_asset_count:
          type: integer
          format: int64
          description: 含子树的资产合计。与 `asset_count` 回答的是两个不同的问题：删这个组会不会被拦住、点进去能看到几条。
        children:
          type: array
          items:
            $ref: "#/components/schemas/AssetGroup"
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time

    AssetGroupList:
      type: object
      title: 资产组树
      required: [items]
      properties:
        items:
          type: array
          description: 根节点数组，子节点在各自的 `children` 里
          items:
            $ref: "#/components/schemas/AssetGroup"

    CreateAssetGroupRequest:
      type: object
      title: 新建资产组
      required: [name]
      properties:
        parent_id:
          type: [integer, "null"]
          format: uint64
          description: 父组 ID；省略或 `null` 表示建为根组
        name:
          type: string
          maxLength: 64
        description:
          type: string
          maxLength: 255
        sort_order:
          type: integer

    UpdateAssetGroupRequest:
      type: object
      title: 编辑资产组
      description: |
        全部字段可选，未出现的字段不修改。**不含 `parent_id`** —— 移动是独立
        端点 `POST /api/asset-groups/{id}/move`。
      properties:
        name:
          type: string
          maxLength: 64
        description:
          type: string
          maxLength: 255
        sort_order:
          type: integer

    MoveAssetGroupRequest:
      type: object
      title: 移动资产组
      properties:
        parent_id:
          type: [integer, "null"]
          format: uint64
          description: 目标父组；省略或 `null` 表示移到根

    # ---------------------------------------------------------- 资产台账

    AssetStatus:
      type: string
      title: 资产状态
      description: |
        资产**退役请用 `scrapped`，不要删除**：台账的价值在于「这台机器曾经
        存在、已于某时退役」，删掉就丢掉了一段事实。
      enum: [in_use, idle, offline, scrapped]

    Asset:
      type: object
      title: 资产
      required: [id, name, asset_type, asset_type_name, importance, status, tags]
      properties:
        id:
          type: integer
          format: uint64
        asset_no:
          type: string
          description: 业务编号。**未编号时为空串**（库里是 `NULL`）——唯一索引下多个 `NULL` 互不冲突，因此可以有很多条未编号的资产
        name:
          type: string
        asset_type:
          type: string
          description: 资产类型**码**（`dictionaries.code`），不是主键 id
        asset_type_name:
          type: string
          description: |
            类型的中文名。由服务端一次性补齐而不是让前端逐行查字典；
            因此类型被**停用**后这里仍能正确显示，不会变成空白列。
        group_id:
          type: [integer, "null"]
          format: uint64
        group_name:
          type: string
          description: 所属资产组名（未分组时为空串）
        ip_address:
          type: string
        port:
          type: integer
          description: 端口。**未填写时为 0**，前端据此显示「—」；这个 0 只用于展示，不能回写数据库
        hostname:
          type: string
        os_type:
          type: string
        importance:
          type: integer
          minimum: 1
          maximum: 5
          description: 资产价值 A。未填写时默认 3（中档，避免「不填 = 最低」）
        owner:
          type: string
        department:
          type: string
        status:
          $ref: "#/components/schemas/AssetStatus"
        tags:
          type: array
          description: 标签。库里以逗号分隔存储，对外始终是数组（空时是 `[]` 而非 `null`）
          items:
            type: string
        description:
          type: string
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time

    AssetPage:
      type: object
      title: 资产分页结果
      required: [items, total, page, page_size]
      properties:
        items:
          type: array
          items:
            $ref: "#/components/schemas/Asset"
        total:
          type: integer
          format: int64
        page:
          type: integer
        page_size:
          type: integer

    CreateAssetRequest:
      type: object
      title: 新建资产
      required: [name, asset_type]
      properties:
        asset_no:
          type: string
          maxLength: 64
          pattern: "^[A-Za-z0-9][A-Za-z0-9_./-]{0,63}$"
          description: 可留空。允许 `/`（企业台账里「2026/Q1/NET-001」很常见）。全局唯一。
        name:
          type: string
          maxLength: 128
        asset_type:
          type: string
          description: 类型码。必须存在**且启用**，否则 `ASSET_TYPE_UNKNOWN`（400）
        group_id:
          type: [integer, "null"]
          format: uint64
        ip_address:
          type: string
          maxLength: 64
          description: IPv4 / IPv6 / CIDR 网段 / 主机名
        port:
          type: [integer, "null"]
          minimum: 1
          maximum: 65535
        hostname:
          type: string
          maxLength: 128
        os_type:
          type: string
          maxLength: 64
        importance:
          type: integer
          minimum: 1
          maximum: 5
          description: 省略按 3
        owner:
          type: string
          maxLength: 64
        department:
          type: string
          maxLength: 64
        status:
          $ref: "#/components/schemas/AssetStatus"
        tags:
          type: array
          maxItems: 10
          description: 单个标签不超过 32 字，且不能含逗号（标签以逗号分隔存储）
          items:
            type: string
            maxLength: 32
        description:
          type: string
          maxLength: 512

    UpdateAssetRequest:
      type: object
      title: 编辑资产
      description: |
        全部字段可选。`asset_no` / `group_id` / `port` 是**三态**的
        （不传 = 不修改，`null` = 清空，给值 = 设值），其余字符串字段
        是两态（不传 = 不修改，空串 = 清空）。
      properties:
        asset_no:
          type: [string, "null"]
          maxLength: 64
          pattern: "^[A-Za-z0-9][A-Za-z0-9_./-]{0,63}$"
          description: 不传 = 不修改；`null` = 清空（变为「未编号」）；给值 = 设为该编号
        name:
          type: string
          maxLength: 128
        asset_type:
          type: string
          description: 只在**真的变了**的时候校验「存在且启用」，否则改备注也会被拦下
        group_id:
          type: [integer, "null"]
          format: uint64
          description: 不传 = 不修改；`null` = 移出分组
        ip_address:
          type: string
          maxLength: 64
        port:
          type: [integer, "null"]
          minimum: 1
          maximum: 65535
          description: 不传 = 不修改；`null` = 清空
        hostname:
          type: string
          maxLength: 128
        os_type:
          type: string
          maxLength: 64
        importance:
          type: integer
          minimum: 1
          maximum: 5
        owner:
          type: string
          maxLength: 64
        department:
          type: string
          maxLength: 64
        status:
          $ref: "#/components/schemas/AssetStatus"
        tags:
          type: array
          maxItems: 10
          description: 不传 = 不修改；传 `[]` = 清空
          items:
            type: string
            maxLength: 32
        description:
          type: string
          maxLength: 512

    # ---------------------------------------------------------- 批量导入

    ImportRowError:
      type: object
      title: 单行导入错误
      required: [row, column, value, message]
      properties:
        row:
          type: integer
          description: |
            **源文件里的行号**（含表头、从 1 开始），不是「第几个数据行」。
            用户打开 Excel 就能直接跳到这一行改。
        column:
          type: string
          description: 出错的列名（与模板表头逐字一致）；空串表示这是整行级问题（如重复）
        value:
          type: string
          description: 单元格原值，便于用户对照
        message:
          type: string
          description: 具体原因。只说「不合法」而不说「该怎么改」的提示等于没有提示

    AssetImportPreview:
      type: object
      title: 导入预览结果
      required: [file_name, format, total_rows, valid_rows, error_rows, errors, truncated_errors, unmatched_groups, groups_to_create, missing_columns]
      properties:
        file_name:
          type: string
        format:
          type: string
          enum: [xlsx, csv]
          description: 按**魔数**嗅探得到，不是按扩展名——把 xlsx 改名成 .csv 也能正确识别
        total_rows:
          type: integer
          description: 数据行数（不含表头，已剔除全空行）
        valid_rows:
          type: integer
        error_rows:
          type: integer
          description: 不合格的行数。**这是真实总数**，可能大于 `errors` 的长度。
        errors:
          type: array
          items:
            $ref: "#/components/schemas/ImportRowError"
          description: 最多 200 条。超出的部分只计数不列出——错误太多时看总数就够了
        truncated_errors:
          type: boolean
          description: "`errors` 是否被截断"
        unmatched_groups:
          type: array
          description: 文件引用、系统中不存在、且**未**选择自动创建的资产组（可读路径，去重后按字典序）。非空会让 commit 失败。
          items:
            type: string
        groups_to_create:
          type: array
          description: 文件引用、系统中不存在、且**已**选择自动创建、因此会在 commit 时被建出来的资产组（含中间层级）
          items:
            type: string
        missing_columns:
          type: array
          description: 文件缺少的必需列。非空时其它字段无意义（此时按列取值已经对不上，继续逐行校验只会产出一堆误导性错误）
          items:
            type: string

    AssetImportResult:
      type: object
      title: 导入结果
      required: [imported, created_groups]
      properties:
        imported:
          type: integer
          description: 本次写入的资产条数
        created_groups:
          type: integer
          description: 为本次导入而新建的资产组数量（含中间层级）

    # ======================================================= 风险评估（P4）

    AssessmentStatus:
      type: string
      title: 评估任务状态
      enum: [draft, calculated]
      description: |
        `draft` 草稿（可反复试算，没有落库结果）；`calculated` 已计算。

        改范围或默认威胁**不会**自动退回 `draft`，也不会自动重算：
        「改了参数」与「按新参数算出结果」是两件事，
        自动重算会让「我明明只改了个名字，结果怎么全变了」变成一次
        找不到原因的投诉。

    AssessmentScopeType:
      type: string
      title: 评估范围类型
      enum: [all, group, custom]
      description: |
        `all` 全部资产（此时 `scope_ref` 必须为空）；`group` 按资产组，
        自动展开子组；`custom` 手工指定资产。

        三种范围都会排除已报废（`scrapped`）的资产。范围决定「评哪些」，
        状态决定「还值不值得评」；混在一起会让同一个资产在 `all` 与
        `custom` 下得到互相矛盾的结论，而那解释不通。

    RiskLevel:
      type: string
      title: 风险等级
      enum: [very_high, high, medium, low, very_low]
      description: |
        由 `R = A × T × V` 与阈值比较得出。判定**只在后端发生**
        （`docs/01` §2.6 的铁律）：前端只按这个字符串查色板，
        不做任何数值比较，也不自己算档位。

    RiskThresholds:
      type: object
      title: 风险等级阈值
      required: [very_high, high, medium, low]
      properties:
        very_high:
          type: integer
          description: R ≥ 该值判「很高」
        high:
          type: integer
          description: R ≥ 该值判「高」
        medium:
          type: integer
          description: R ≥ 该值判「中」
        low:
          type: integer
          description: R ≥ 该值判「低」；低于它判「很低」
      description: |
        四个阈值必须**严格递减**且 `low ≥ 1`。两条约束各有明确后果：

        - 相等会让中间那一档**永远判不出来**（判定从高到低，先命中的先返回）；
        - `low = 0` 会让「很低」这一档永远为空。

        不满足时写接口返回 `RISK_CONFIG_INVALID`，且**不会**留下半改状态。

    RiskEngineSnapshot:
      type: object
      title: 计算配置快照
      required: [model, asset_weight, thresholds, captured_at]
      properties:
        model:
          type: string
          description: 模型标识，当前恒为 `gb_t_20984_multiplication`
        asset_weight:
          type: number
          format: double
          description: 计算时生效的资产价值权重系数
        thresholds:
          $ref: "#/components/schemas/RiskThresholds"
        captured_at:
          type: string
          format: date-time
          description: 快照时间。有了它，「这份评估比那次改配置早还是晚」不需要翻审计日志
      description: |
        **这是历史评估可复现的关键。** 权重与阈值存在系统配置里且界面可改，
        若不快照，改一次阈值就会静默改写所有历史评估的档位——已发出的报告
        与库里的数据对不上，而这类事故最难排查：数据看起来都对，
        只是和昨天不一样了。

    Assessment:
      type: object
      title: 评估任务
      description: |
        **所有 key 必然出现**（含下面几个可空字段：`max_risk`、`calculated_at`、
        `config_snapshot`）——可空指的是「值可以是 `null`」，不是「key 可能缺席」。
        前端因此可以在模板里直接 `assessment.scope_ref.length`，不必层层写 `?? []`。
      required:
        - id
        - name
        - description
        - status
        - scope_type
        - scope_ref
        - model_key
        - default_threat_code
        - default_threat_name
        - assets_count
        - risk_items_count
        - max_risk
        - level_counts
        - calculated_at
        - config_snapshot
        - created_at
        - updated_at
      properties:
        id:
          type: integer
          format: uint64
        name:
          type: string
        description:
          type: string
        status:
          $ref: "#/components/schemas/AssessmentStatus"
        scope_type:
          $ref: "#/components/schemas/AssessmentScopeType"
        scope_ref:
          type: array
          description: 范围明细。`all` 时为空数组（**是 `[]` 不是 `null`**——空数组与
            「没有这个字段」在展示层是两件事，前者可以直接 `.length`）；`group` 存组 ID；
            `custom` 存资产 ID
          items:
            type: integer
            format: uint64
        model_key:
          type: string
        default_threat_code:
          type: string
          description: 任务级默认威胁码；空串表示未指定
        default_threat_name:
          type: string
          description: 默认威胁的显示名（服务端翻译好，列表页不用再查一次字典）
        assets_count:
          type: integer
          description: 纳入计算的资产数（最近一次计算写入）
        risk_items_count:
          type: integer
        max_risk:
          type: [number, "null"]
          description: 最大风险值。**未计算时为 `null` 而不是 `0`**——
            用 0 当哨兵会让「算了但风险为 0」与「根本没算」无法区分
        level_counts:
          type: object
          description: 各等级条数。五个等级**都会出现**（没有的填 0），前端不用在模板里写一堆 `|| 0`
          additionalProperties:
            type: integer
        calculated_at:
          type: [string, "null"]
          format: date-time
        config_snapshot:
          description: 计算时的配置快照。未计算时为 `null`
          oneOf:
            - $ref: "#/components/schemas/RiskEngineSnapshot"
            - type: "null"
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time

    AssessmentPage:
      type: object
      title: 评估任务分页
      required: [items, total]
      properties:
        items:
          type: array
          items:
            $ref: "#/components/schemas/Assessment"
        total:
          type: integer

    CreateAssessmentRequest:
      type: object
      title: 新建评估任务请求
      required: [name, scope_type]
      properties:
        name:
          type: string
          description: 任务名称，最长 128 个字符
        description:
          type: string
          description: 说明，最长 512 个字符
        scope_type:
          $ref: "#/components/schemas/AssessmentScopeType"
        scope_ref:
          type: array
          description: 范围明细，`all` 时必须为空；`group` / `custom` 时必填，最多 500 项，且每个 ID 必须真实存在
          items:
            type: integer
            format: uint64
        default_threat_code:
          type: string
          description: 默认威胁码，必须存在于字典且处于启用状态；留空表示未指定

    UpdateAssessmentRequest:
      type: object
      title: 编辑评估任务请求
      description: 所有字段可选，未传保持不变。**改完不会自动重算。**
      properties:
        name:
          type: string
        description:
          type: string
        scope_type:
          $ref: "#/components/schemas/AssessmentScopeType"
        scope_ref:
          type: array
          items:
            type: integer
            format: uint64
        default_threat_code:
          type: string

    SetRiskItemThreatRequest:
      type: object
      title: 覆盖风险项威胁请求
      required: [threat_code]
      properties:
        threat_code:
          type: string
          description: 威胁码，必须存在于字典且启用；传空串表示清除覆盖（回落为任务级默认威胁）

    PreviewAssessmentRequest:
      type: object
      title: 试算请求
      description: |
        `assessment_id` 与 `scope_type` 二选一：前者用于已有任务试算
        （评估执行页），后者用于新建页——那里还没有任务行可以指。
      properties:
        assessment_id:
          type: [integer, "null"]
          format: uint64
          description: 按该任务的范围与默认威胁试算；传了它时下面四个字段被忽略
        scope_type:
          $ref: "#/components/schemas/AssessmentScopeType"
        scope_ref:
          type: array
          items:
            type: integer
            format: uint64
        default_threat_code:
          type: string
        asset_weight:
          type: [number, "null"]
          format: double
          description: 临时覆盖资产价值权重系数（阈值预览用）
        thresholds:
          description: 临时覆盖四个阈值（阈值预览用）
          oneOf:
            - $ref: "#/components/schemas/RiskThresholds"
            - type: "null"

    PreviewAssessmentResult:
      type: object
      title: 试算结果
      description: 所有 key 必然出现；`assets` / `top_items` 没有内容时是空数组，不是 `null`。
      required:
        - config
        - scope_type
        - scope_ref
        - assets_count
        - risk_items_count
        - unmatched_assets
        - max_risk
        - level_counts
        - assets
        - top_items
      properties:
        config:
          $ref: "#/components/schemas/RiskEngineSnapshot"
        scope_type:
          $ref: "#/components/schemas/AssessmentScopeType"
        scope_ref:
          type: array
          items:
            type: integer
            format: uint64
        assets_count:
          type: integer
        risk_items_count:
          type: integer
        unmatched_assets:
          type: integer
          description: 范围内没有任何漏洞关联的资产数。这部分资产不会产生风险项，单独列出是为了让「怎么才 3 条」有答案
        max_risk:
          type: number
          format: double
        level_counts:
          type: object
          additionalProperties:
            type: integer
        assets:
          type: array
          description: 资产级汇总，按风险值从高到低，最多 200 条
          items:
            $ref: "#/components/schemas/AssessmentAssetSummary"
        top_items:
          type: array
          description: 风险值最高的风险项，最多 20 条
          items:
            $ref: "#/components/schemas/RiskItem"

    AssessmentAssetSummary:
      type: object
      title: 资产级风险汇总
      required:
        - asset_id
        - asset_name
        - asset_ip
        - importance
        - asset_value_a
        - risk_value
        - risk_level
        - risk_items_count
        - top_item_id
      properties:
        asset_id:
          type: integer
          format: uint64
        asset_name:
          type: string
        asset_ip:
          type: string
        importance:
          type: integer
          minimum: 1
          maximum: 5
          description: 资产重要性原始档位（矩阵横轴）
        asset_value_a:
          type: number
          format: double
          description: A = 重要性 × 资产价值权重系数
        risk_value:
          type: number
          format: double
          description: |
            该资产下**最严重**的一条风险项的 R，不是平均值——
            一台机器能被打穿到什么程度，取决于它最弱的那一环。
        risk_level:
          $ref: "#/components/schemas/RiskLevel"
        risk_items_count:
          type: integer
        top_item_id:
          type: [integer, "null"]
          format: uint64
          description: 最大 R 对应的风险项 ID，供下钻直跳

    RiskItem:
      type: object
      title: 风险项（资产 × 漏洞）
      description: |
        所有 key 必然出现。A/T/V/R 四个量是 `float64` 而非可空类型——
        「算不出来」在这张表里不存在，每一条都是算过的。

        A / T / V / R **四列齐存**，不只存 R：下钻时用户要问「这台机器为什么
        是 20 分」，必须能当场拆出 `4 × 5 × 1`。只存结果等于放弃可解释性，
        事后也无法复核规则本身是否合理——与 P3 保留 `severity_raw` 同一条理由。
      required:
        - id
        - assessment_id
        - asset_id
        - vuln_id
        - asset_name
        - asset_ip
        - vuln_title
        - vuln_cve_ids
        - vuln_severity_raw
        - threat_code
        - threat_name
        - threat_source
        - importance
        - severity
        - asset_value_a
        - threat_weight_t
        - vuln_weight_v
        - risk_value_r
        - risk_level
      properties:
        id:
          type: integer
          format: uint64
        assessment_id:
          type: integer
          format: uint64
        asset_id:
          type: integer
          format: uint64
          description: 逻辑引用（未建外键），展示一律走下面的快照列
        vuln_id:
          type: integer
          format: uint64
          description: 逻辑引用（未建外键）
        asset_name:
          type: string
          description: 资产名称快照。目标被删除后报告仍然完整可读
        asset_ip:
          type: string
        vuln_title:
          type: string
        vuln_cve_ids:
          type: string
        vuln_severity_raw:
          type: string
        threat_code:
          type: string
        threat_name:
          type: string
        threat_source:
          type: string
          enum: [default, manual]
          description: |
            `default` 取任务级默认威胁 / `manual` 在风险项上逐项覆盖。
            保留来源与 `vuln_asset_links.matched_by` 同理：能溯源才敢批量改回去。
        importance:
          type: integer
          minimum: 1
          maximum: 5
          description: 资产重要性原始档位（矩阵横轴，不受权重影响）
        severity:
          type: integer
          minimum: 1
          maximum: 5
          description: 漏洞严重程度原始档位（矩阵纵轴）
        asset_value_a:
          type: number
          format: double
          description: A：资产价值 = 重要性 × 资产价值权重系数
        threat_weight_t:
          type: number
          format: double
          description: T：威胁权重
        vuln_weight_v:
          type: number
          format: double
          description: V：脆弱性权重
        risk_value_r:
          type: number
          format: double
          description: R = A × T × V
        risk_level:
          $ref: "#/components/schemas/RiskLevel"

    RiskItemPage:
      type: object
      title: 风险项分页
      required: [items, total]
      properties:
        items:
          type: array
          items:
            $ref: "#/components/schemas/RiskItem"
        total:
          type: integer

    RiskMatrix:
      type: object
      title: 风险矩阵
      required: [grid_size, max_grade, total, cells]
      properties:
        assessment_id:
          type: integer
          format: uint64
        grid_size:
          type: integer
          description: 边长，恒为 5
        max_grade:
          type: integer
          description: 档位上限，恒为 5
        total:
          type: integer
          description: 全部格子的风险项总数（等于评估的 risk_items_count）
        cells:
          type: array
          description: 全部 25 个格子，按 importance 升序、severity 升序。空格 `count=0`
          items:
            $ref: "#/components/schemas/RiskMatrixCell"

    RiskMatrixCell:
      type: object
      title: 风险矩阵格子
      required: [importance, severity, count, max_risk, level]
      properties:
        importance:
          type: integer
          minimum: 1
          maximum: 5
        severity:
          type: integer
          minimum: 1
          maximum: 5
        count:
          type: integer
        max_risk:
          type: number
          format: double
          description: 格子内最大 R；空格为 0
        level:
          $ref: "#/components/schemas/RiskLevel"
          description: 由格子内最大 R 与**该评估的快照配置**判定

    ExportAssessmentMeta:
      type: object
      title: 报告头部的评估信息
      required: [id, name, assets_count, risk_items_count]
      properties:
        id:
          type: integer
          format: uint64
        name:
          type: string
        description:
          type: string
        scope_type:
          $ref: "#/components/schemas/AssessmentScopeType"
        scope_ref:
          type: array
          items:
            type: integer
            format: uint64
        default_threat_code:
          type: string
        default_threat_name:
          type: string
        assets_count:
          type: integer
        risk_items_count:
          type: integer
        calculated_at:
          type: string
          description: 最近一次计算时间；未计算为空串

    ExportAsset:
      type: object
      title: 报告中的资产条目
      required: [asset_id, asset_name, risk_value, risk_level, risk_items_count]
      properties:
        asset_id:
          type: integer
          format: uint64
        asset_name:
          type: string
        asset_ip:
          type: string
        importance:
          type: integer
          minimum: 1
          maximum: 5
        asset_value_a:
          type: number
          format: double
        risk_value:
          type: number
          format: double
        risk_level:
          $ref: "#/components/schemas/RiskLevel"
        risk_items_count:
          type: integer

    AssessmentExportData:
      type: object
      title: 报告数据
      required: [assessment, config, level_counts, max_risk, assets, items, generated_at]
      properties:
        assessment:
          $ref: "#/components/schemas/ExportAssessmentMeta"
        config:
          $ref: "#/components/schemas/RiskEngineSnapshot"
        level_counts:
          type: object
          additionalProperties:
            type: integer
        max_risk:
          type: number
          format: double
        assets:
          type: array
          items:
            $ref: "#/components/schemas/ExportAsset"
        items:
          type: array
          description: 扁平的风险项列表（含 asset_id 关联），按风险值从高到低
          items:
            $ref: "#/components/schemas/RiskItem"
        generated_at:
          type: string
          format: date-time
      description: |
        报告渲染器将要消费的那一份数据。

        它在 P4 就存在，是为了让验收能真正收口：`docs/01` 给 P4 的验收标志是
        「界面值 = 落库值 = 报告值」三者一致，而报告要到 P5 才渲染。
        本接口把「报告值」这一路的数字提前钉死，三方等式因此在本阶段
        就能逐条比对，P5 只需保证「把这份数据原样画出来」。

    # ====================================================== 系统配置（P4）

    SystemConfigItem:
      type: object
      title: 系统配置项
      required: [key, value, value_type, editable]
      properties:
        key:
          type: string
        value:
          type: string
          description: 配置值。存储一律是文本，类型只用于前端选择控件
        value_type:
          type: string
          enum: [string, json, int, bool]
        description:
          type: string
        editable:
          type: boolean
          description: 是否允许在界面修改。`risk.model` 为 false——代码认识它，用户不该改它

    SystemConfigView:
      type: object
      title: 风险模型配置
      required: [model, asset_weight, thresholds, items]
      properties:
        model:
          type: string
        asset_weight:
          type: number
          format: double
        thresholds:
          $ref: "#/components/schemas/RiskThresholds"
        updated_at:
          type: string
          description: 最近一次变更时间（RFC3339）；从未变更过为空串
        items:
          type: array
          description: 原始配置行。结构化的三个字段是「给程序用的」，这里是「给人看的」——两者并存不冗余：前者是语义，后者是出处
          items:
            $ref: "#/components/schemas/SystemConfigItem"

    UpdateSystemConfigRequest:
      type: object
      title: 更新风险模型配置请求
      description: |
        每个字段可选，未传保持不变。

        四个阈值可以只传其中几个：服务层会与现值**合并后**再校验，
        因此「只调很高」不会把其它三个顺手写回旧值，也不会因为
        「合并后的组合非法」而留下半改状态（校验在写库之前完成）。
      properties:
        asset_weight:
          type: [number, "null"]
          format: double
          description: 资产价值权重系数，必须 > 0 且 ≤ 100
        thresholds:
          description: 阈值，四个字段各自可选
          oneOf:
            - type: object
              properties:
                very_high:
                  type: integer
                high:
                  type: integer
                medium:
                  type: integer
                low:
                  type: integer
            - type: "null"

    # ---------------------------------------------------- 报告导出（P5）

    ExportReportRequest:
      type: object
      title: 导出报告请求
      required: [assessment_id, format]
      properties:
        assessment_id:
          type: integer
          format: uint64
          minimum: 1
          description: |
            要导出的评估任务 ID。该任务必须处于 `calculated` 状态，
            否则返回 409 `REPORT_NOT_CALCULATED`。
        format:
          $ref: "#/components/schemas/ReportFormat"

    ReportFormat:
      type: string
      title: 报告导出格式
      description: |
        三种格式走三条完全不同的技术路线，因此**失败模式也不同**：

        - `excel` 由 excelize 在 Go 进程内生成，不依赖任何上游，
          因此它**永远不会**返回 `REPORT_RENDER_FAILED`；
        - `word` 依赖 docgen（.NET），`pdf` 依赖 Gotenberg（Chromium），
          两者任一不可用时返回 503 `REPORT_RENDER_FAILED`。

        大小写不敏感：前端下拉传小写，手工 curl 调试时写 `PDF` 也接受。
      enum:
        - word
        - excel
        - pdf

    # ------------------------------------------------- 整改跟踪与首页统计（P6）

    RemediationStatus:
      type: string
      title: 整改单状态
      description: |
        五状态状态机，`closed` 与 `accepted` 是**终态且不可逆**：

        ```
        pending → in_progress | resolved | accepted
        in_progress → resolved | pending（打回） | accepted
        resolved → closed | in_progress（打回） | accepted
        closed / accepted → （无出边）
        ```

        ⚠️ 别在前端另写一份这张表：视图里的 `transitions` 就是它的后端投影。

        ▍与前端的「未闭环」判定必须用同一个集合

        `active_key` 生成列的 SQL 与逾期判定消费同一个集合
        （`pending` / `in_progress` / `resolved`），两者必须永远一致——
        不一致会让数据库允许两张并存的未闭环单（唯一索引失效），
        或让某张单子既不逾期也不在「未闭环」列表里而彻底消失。
      enum: [pending, in_progress, resolved, closed, accepted]

    RemediationTransitionOption:
      type: object
      title: 一次可选的流转
      description: |
        后端状态机的投影。前端遍历它渲染操作按钮——结构上消除
        「界面允许但接口拒绝」这类不一致（前端另写一份规则才会出现）。
      required: [to_status, note_required]
      properties:
        to_status:
          $ref: "#/components/schemas/RemediationStatus"
        note_required:
          type: boolean
          description: |
            本次流转是否必须填写说明。同样是**后端校验规则的投影**：
            前端据此把说明框标成必填。前端另写一份会出现
            「界面没标必填、提交后被 400 拒绝」。
            必填的三种情况：`→ closed`、`→ accepted`、`resolved → in_progress`。

    RemediationLog:
      type: object
      title: 整改单流转 / 变更记录
      required: [id, action, from_status, to_status, note, operator_id, operator_name, created_at]
      properties:
        id:
          type: integer
          format: uint64
        action:
          type: string
          enum: [create, update, transition]
          description: |
            `create` 建单；`update` 改字段（标题 / 说明 / 结论 / 负责人 / 期限）；
            `transition` 状态流转。

            `update` 与 `transition` 分开记，是为了让时间线能回答
            「这张单子是什么时候被谁打回的」——只有 `update` 的话，
            改个期限与打回在历史里长得一样。
        from_status:
          type: string
          description: 变更前状态；`create` 时为空串
        to_status:
          type: string
          description: 变更后状态
        note:
          type: string
          description: 说明（结论 / 理由 / 变更字段摘要）
        operator_id:
          type: [integer, "null"]
          format: uint64
          description: |
            操作人 ID 快照。可空：账号可能已删除，
            但时间线不能因为人走了就断掉。
        operator_name:
          type: string
          description: |
            操作人姓名，**建日志时的快照**，不是实时查用户表：
            时间线要回答「当时是谁做的」，账号后来改名不该改写历史。
        created_at:
          type: string
          format: date-time

    Remediation:
      type: object
      title: 整改单
      description: |
        **所有 key 必然出现**（含下面几个可空字段）——可空指的是
        「值可以是 `null`」，不是「key 可能缺席」。

        ▍时间态是三个字段而不是一个有符号字段

        | 情形 | `overdue` | `overdue_days` | `due_in_days` |
        | --- | --- | --- | --- |
        | 未设期限 | `false` | `0` | `null` |
        | 未逾期 | `false` | `0` | `>= 0`（`0` = 今天到期） |
        | 已逾期未闭环 | `true` | `> 0` | `null` |
        | 已闭环 | `false` | `0` | `null` |

        合成一个有符号字段（负号表示逾期）能少一个字段，代价是每个消费方
        都要记得那个符号约定——一旦忘了，界面上就会出现「逾期 -3 天」。

        ⚠️ 最后一行是有意的：**逾期是当前态，不是一个历史事实**。
        一张逾期三天才闭环的单子，闭环之后就不再是「逾期」的了。

        ▍出处可能失效

        `assessment_id` 与 `risk_item_id` 是**发现出处**而不是外键约束：
        P4 重算评估会整批替换 `risk_items`，重算后 `risk_item_id` 即指向
        不存在的行。这是设计允许的，前端跳转时若 404 只提示
        「来源评估已更新」，不影响单子本身——展示一律走下面的快照列。
      required:
        - id
        - asset_id
        - vuln_id
        - assessment_id
        - risk_item_id
        - asset_name
        - asset_ip
        - vuln_title
        - vuln_cve_ids
        - risk_level
        - risk_value_r
        - title
        - description
        - resolution
        - status
        - assignee_id
        - assignee_name
        - due_date
        - overdue
        - overdue_days
        - due_in_days
        - transitions
        - created_by_name
        - closed_at
        - created_at
        - updated_at
      properties:
        id:
          type: integer
          format: uint64
        asset_id:
          type: integer
          format: uint64
          description: |
            业务身份的一半（逻辑引用，未建外键）。它与 `vuln_id` 一起构成
            整改单的真实身份——这两个 ID 不随评估重算变化。
        vuln_id:
          type: integer
          format: uint64
          description: 业务身份的另一半（逻辑引用）
        assessment_id:
          type: [integer, "null"]
          format: uint64
          description: 发现它的评估任务（出处，允许失效）
        risk_item_id:
          type: [integer, "null"]
          format: uint64
          description: 建单时的风险项 ID（出处，评估重算后即失效——这是设计允许的）
        asset_name:
          type: string
          description: 资产名称快照。目标被删除、出处失效后单子仍完整可读
        asset_ip:
          type: string
        vuln_title:
          type: string
        vuln_cve_ids:
          type: string
        risk_level:
          $ref: "#/components/schemas/RiskLevel"
        risk_value_r:
          type: number
          format: double
          description: 建单时该风险项的 R
        title:
          type: string
        description:
          type: string
        resolution:
          type: string
          description: 整改结论。`→ closed` 时必填（通过流转的说明字段写入）
        status:
          $ref: "#/components/schemas/RemediationStatus"
        assignee_id:
          type: [integer, "null"]
          format: uint64
        assignee_name:
          type: string
          description: 负责人显示名；未分派或账号已删除时为空串
        due_date:
          type: [string, "null"]
          format: date
          description: 整改期限 `YYYY-MM-DD`；`null` = 未设期限（永远不算逾期）
        overdue:
          type: boolean
        overdue_days:
          type: integer
          description: 已逾期天数；未逾期时为 `0`
        due_in_days:
          type: [integer, "null"]
          description: |
            距到期天数（含今天，`0` = 今天到期）。未设期限或已逾期时为 `null`
            ——逾期时看 `overdue_days`，因为它更贴近「拖了多久」这个问题。
        transitions:
          type: array
          description: 当前状态可选的下一步（后端状态机投影）
          items:
            $ref: "#/components/schemas/RemediationTransitionOption"
        created_by_name:
          type: string
        closed_at:
          type: [string, "null"]
          format: date-time
          description: |
            进入终态（`closed` 或 `accepted`）的时间；未闭环时为 `null`。
            一个字段覆盖两个终态：两者的语义差别由 `status` 承担，
            再拆一个 `accepted_at` 只会多一个需要同步维护的字段。
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time

    RemediationDetail:
      type: object
      title: 整改单详情（含时间线）
      required: [remediation, logs]
      properties:
        remediation:
          $ref: "#/components/schemas/Remediation"
        logs:
          type: array
          description: 按 `id` 升序的完整时间线（含建单记录）
          items:
            $ref: "#/components/schemas/RemediationLog"

    RemediationPage:
      type: object
      title: 整改单分页
      required: [items, total]
      properties:
        items:
          type: array
          items:
            $ref: "#/components/schemas/Remediation"
        total:
          type: integer

    CreateRemediationRequest:
      type: object
      title: 新建整改单请求
      required: [risk_item_id]
      properties:
        risk_item_id:
          type: integer
          format: uint64
          minimum: 1
          description: |
            必填。整改单要有风险等级与风险值，而这两者只有风险项才有。
            推荐路径是先从评估结果页拿到风险项 ID，而不是让用户手工填。
        title:
          type: string
          description: 留空则取漏洞标题
        description:
          type: string
        assignee_id:
          type: [integer, "null"]
          format: uint64
          description: 整改负责人；不传或 `null` 表示暂不分派
        due_date:
          type: string
          format: date
          description: 整改期限 `YYYY-MM-DD`；空串 = 不设期限

    UpdateRemediationRequest:
      type: object
      title: 修改整改单请求
      description: 至少给出一个字段；全部不传时返回错误（没有变更的 PATCH 是误操作）。
      properties:
        title:
          type: string
        description:
          type: string
        resolution:
          type: string
        assignee_id:
          type: [integer, "null"]
          format: uint64
          description: 不传 = 不修改；`null` = 取消分派；有值 = 改为该人
        due_date:
          type: [string, "null"]
          format: date
          description: 不传 = 不修改；`null` = 清除期限；有值 = 改为该日期（`YYYY-MM-DD`）

    TransitionRemediationRequest:
      type: object
      title: 整改单状态流转请求
      required: [to_status]
      properties:
        to_status:
          $ref: "#/components/schemas/RemediationStatus"
        note:
          type: string
          description: |
            流转说明。三种情况必填：`→ closed`（怎么修的）、
            `→ accepted`（为什么不修）、`resolved → in_progress`（打回理由）。
            缺说明返回 400 `REMEDIATION_NOTE_REQUIRED`。
            哪些目标必填由 `Remediation.transitions[].note_required` 给出。

    BatchCreateRemediationRequest:
      type: object
      title: 批量建单请求
      required: [assessment_id]
      properties:
        assessment_id:
          type: integer
          format: uint64
          minimum: 1
          description: 评估任务 ID。必须已计算，否则返回 409 `REMEDIATION_BATCH_EMPTY`
        levels:
          type: array
          description: 只对哪些等级的风险项建单；为空时取「很高 + 高」
          items:
            $ref: "#/components/schemas/RiskLevel"
        due_in_days:
          type: [integer, "null"]
          description: |
            统一的整改期限：今天 + N 天。不传或 `null` = 不设期限。
            批量建单刻意只支持相对天数而不是绝对日期：批量场景下
            「统一给两周」是真实需求，「每张单子各挑一个日子」不是。
        assignee_id:
          type: [integer, "null"]
          format: uint64
          description: 统一负责人；不传或 `null` 表示暂不分派

    BatchCreateRemediationResult:
      type: object
      title: 批量建单结果
      required: [assessment_id, matched, created, skipped, ids]
      properties:
        assessment_id:
          type: integer
          format: uint64
        matched:
          type: integer
          description: 命中（符合等级筛选）的风险项条数
        created:
          type: integer
          description: 本次新建的整改单条数
        skipped:
          type: integer
          description: |
            已有未闭环单因而跳过的条数。**幂等的直接体现**：
            同一个评估连续点两次批量建单，第二次 `created=0`、
            `skipped=matched`，而不是报一堆重复错误。
        ids:
          type: array
          description: 本次新建的整改单 ID（供前端跳转或高亮）
          items:
            type: integer
            format: uint64

    DashboardSummary:
      type: object
      title: 首页汇总
      description: |
        只读聚合，**不做任何风险计算**：所有风险数字直接取 P4 已落库的结果。

        ▍口径

        风险数字（`assessments.latest` 里的全部内容）**绑定一个具体评估**，
        而资产 / 漏洞 / 整改单是**全局当前态**，与评估无关。

        ▍分区读取

        仪表盘的每个区块都独立查询，任何一个区块失败都会让整次请求失败
        （而不是返回半份数据）。理由是半份数据更危险：首页少一个数字，
        用户会以为那个数字是 0。
      required: [generated_at, assets, vulnerabilities, assessments, remediations, recent_remediations]
      properties:
        generated_at:
          type: string
          format: date-time
          description: 生成时间。缓存或前端展示「数据截至」时用它
        assets:
          $ref: "#/components/schemas/DashboardAssets"
        vulnerabilities:
          $ref: "#/components/schemas/DashboardVulnerabilities"
        assessments:
          $ref: "#/components/schemas/DashboardAssessments"
        remediations:
          $ref: "#/components/schemas/DashboardRemediations"
        recent_remediations:
          type: array
          description: 最近更新的整改单（按 `updated_at` 倒序，最多 5 条）
          items:
            $ref: "#/components/schemas/Remediation"

    DashboardAssets:
      type: object
      title: 资产概览
      required: [total, by_type, scrapped]
      properties:
        total:
          type: integer
          description: 资产总数，**含已报废**（与资产列表页的口径一致）
        by_type:
          type: array
          description: |
            按资产类型分布，与 `total` 同一口径（含已报废）。
            名称取自字典；字典里查不到的码（历史数据、已删字典项）
            `name` 留空，前端显示原始码——这类条目恰恰最该被看见。
          items:
            $ref: "#/components/schemas/DashboardNamedCount"
        scrapped:
          type: integer
          description: 已报废数量。单独给出来，用户才不会困惑「怎么有这么多资产」

    DashboardNamedCount:
      type: object
      title: 带展示名的计数
      required: [code, name, count]
      properties:
        code:
          type: string
        name:
          type: string
          description: 展示名；字典里查不到时为空串（前端退化为显示 `code`）
        count:
          type: integer

    DashboardVulnerabilities:
      type: object
      title: 漏洞概览
      required: [total, by_severity]
      properties:
        total:
          type: integer
        by_severity:
          type: array
          description: |
            按 1–5 档位分布，**五个档位一定都在**（没有的填 `0`）。
            与 `level_counts` / `by_status` 同一约定：固定形状才能固定渲染，
            前端不必为「某一档今天恰好没有」写分支。
          items:
            $ref: "#/components/schemas/DashboardSeverityCount"

    DashboardSeverityCount:
      type: object
      title: 按严重程度档位的计数
      required: [severity, count]
      properties:
        severity:
          type: integer
          minimum: 1
          maximum: 5
        count:
          type: integer

    DashboardAssessments:
      type: object
      title: 评估任务概览
      required: [total, calculated, draft, latest]
      properties:
        total:
          type: integer
        calculated:
          type: integer
        draft:
          type: integer
        latest:
          type: [object, "null"]
          description: |
            风险数字所依附的那一次评估。三种可能：调用方显式传了
            `assessment_id` → 就是它；没传 → 最近一次**已计算**的评估；
            库里一次都没算过 → `null`（合法空场景，前端显示空态而不是报错）。
          allOf:
            - $ref: "#/components/schemas/DashboardLatestAssessment"

    DashboardLatestAssessment:
      type: object
      title: 风险数字所依附的评估
      description: |
        ⚠️ 界面上**必须显示** `id` / `name` / `calculated_at` 这三项：
        同一句「很高风险有多少条」在不同评估口径下是四个不同的数字，
        不注明口径的汇总数字没有意义。
      required:
        - id
        - name
        - status
        - calculated_at
        - assets_count
        - risk_items_count
        - max_risk
        - level_counts
        - top_assets
      properties:
        id:
          type: integer
          format: uint64
        name:
          type: string
        status:
          $ref: "#/components/schemas/AssessmentStatus"
        calculated_at:
          type: [string, "null"]
          format: date-time
          description: 已计算时有值；显式查询了一个草稿评估时为空
        assets_count:
          type: integer
        risk_items_count:
          type: integer
        max_risk:
          type: [number, "null"]
          format: double
          description: 这次评估的最大 R；草稿或空结果时为 `null`
        level_counts:
          type: object
          description: |
            按等级的风险项条数。五个等级**都会出现**（没有的填 `0`），
            因此前端可以固定渲染五格而不是先看有没有这个键。
            JSON 解析失败时返回全零而不是报错——一份存坏了的历史结果
            不该让整个首页打不开。
          additionalProperties:
            type: integer
        top_assets:
          type: array
          description: |
            风险值最高的若干资产（最多 5 个）。
            单独开一个有 `LIMIT` 的查询：为显示 5 行拉回整张资产汇总表
            是仪表盘最常见的性能事故。
          items:
            $ref: "#/components/schemas/DashboardTopAsset"

    DashboardTopAsset:
      type: object
      title: 风险值最高的资产
      required: [asset_id, asset_name, asset_ip, risk_value, risk_level, risk_items_count]
      properties:
        asset_id:
          type: integer
          format: uint64
        asset_name:
          type: string
        asset_ip:
          type: string
        risk_value:
          type: number
          format: double
          description: 该资产下最严重的一条风险项的 R，不是平均值
        risk_level:
          $ref: "#/components/schemas/RiskLevel"
        risk_items_count:
          type: integer

    DashboardRemediations:
      type: object
      title: 整改单概览
      description: |
        `total` 与 `active` 由 `by_status` 的五个状态**派生**，不另查两次
        `COUNT`：两次查询之间落进来的新单会让它们对不上，
        而对不上的是首页上并排显示的两个数字。
      required: [total, active, by_status, overdue, due_soon, due_within_days]
      properties:
        total:
          type: integer
        active:
          type: integer
          description: 未闭环（`pending` / `in_progress` / `resolved`）
        by_status:
          type: object
          description: 五个状态**一定都在**（没有的填 `0`）
          additionalProperties:
            type: integer
        overdue:
          type: integer
          description: 已逾期未闭环条数（`due_date < 今天`）
        due_soon:
          type: integer
          description: |
            未来 `due_within_days` 天内到期（**含今天**）且未闭环的条数。
            与 `overdue` 的区间**不重叠**：今天到期的算 `due_soon` 不算
            `overdue`。重叠会让同一个单子在两个数字里各出现一次，
            用户会以为有两张单子。
        due_within_days:
          type: integer
          description: 「即将到期」的窗口天数（当前为 7），由后端给出而不是前端写死
